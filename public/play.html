<script>
// =========================================================================
// FEVER MJ コアロジック
// =========================================================================

// ============ tile.js ============
function tileSuit(tile) { return tile[0]; }
function tileNumber(tile) { return parseInt(tile[1], 10); }
function isRed(tile) { return tile.endsWith('r'); }
function tileBase(tile) { return tile.replace('r', ''); }
function isShuupai(tile) { return tile[0] !== 'z'; }
function isJihai(tile) { return tile[0] === 'z'; }
function isTerminal(tile) {
  if (!isShuupai(tile)) return false;
  const n = tileNumber(tile);
  return n === 1 || n === 9;
}
function isYaochuhai(tile) { return isTerminal(tile) || isJihai(tile); }

function buildTileSet() {
  const tiles = [];
  for (let n = 1; n <= 9; n++) {
    for (let i = 0; i < 4; i++) tiles.push(`m${n}`);
  }
  for (let n = 1; n <= 9; n++) {
    for (let i = 0; i < 4; i++) {
      tiles.push(n === 5 ? 'p5r' : `p${n}`);
    }
  }
  for (const n of [1, 9]) {
    for (let i = 0; i < 4; i++) tiles.push(`s${n}`);
  }
  for (let n = 1; n <= 7; n++) {
    for (let i = 0; i < 4; i++) tiles.push(`z${n}`);
  }
  return tiles;
}

function sortTiles(tiles) {
  const order = { 'm': 0, 'p': 1, 's': 2, 'z': 3 };
  return [...tiles].sort((a, b) => {
    const sa = order[tileSuit(a)];
    const sb = order[tileSuit(b)];
    if (sa !== sb) return sa - sb;
    const na = tileNumber(a);
    const nb = tileNumber(b);
    if (na !== nb) return na - nb;
    if (isRed(a) && !isRed(b)) return 1;
    if (!isRed(a) && isRed(b)) return -1;
    return 0;
  });
}

function tileToDisplay(tile) {
  const map = {
    'z1': '東', 'z2': '南', 'z3': '西', 'z4': '北',
    'z5': '白', 'z6': '發', 'z7': '中'
  };
  if (map[tile]) return map[tile];
  
  const n = tileNumber(tile);
  const suit = tileSuit(tile);
  if (suit === 'm') {
    return ['','一','二','三','四','五','六','七','八','九'][n];
  }
  if (suit === 'p') {
    return ['','①','②','③','④','⑤','⑥','⑦','⑧','⑨'][n];
  }
  if (suit === 's') {
    return ['','①索','','','','','','','','⑨索'][n];
  }
  return tile;
}

// ============ パターン抽出 ============
function countTiles(tiles) {
  const counts = {};
  for (const t of tiles) {
    const base = tileBase(t);
    counts[base] = (counts[base] || 0) + 1;
  }
  return counts;
}

function findSets(counts, needSets) {
  if (needSets === 0) {
    for (const k in counts) if (counts[k] > 0) return [];
    return [[]];
  }
  const tiles = Object.keys(counts).filter(k => counts[k] > 0).sort();
  if (tiles.length === 0) return [];
  const first = tiles[0];
  const results = [];
  
  if (counts[first] >= 3) {
    const next = { ...counts };
    next[first] -= 3;
    const sub = findSets(next, needSets - 1);
    for (const s of sub) {
      results.push([{ type: 'koutsu', tiles: [first, first, first] }, ...s]);
    }
  }
  
  if (isShuupai(first)) {
    const suit = tileSuit(first);
    const num = tileNumber(first);
    if (num <= 7) {
      const t2 = `${suit}${num + 1}`;
      const t3 = `${suit}${num + 2}`;
      if ((counts[t2] || 0) >= 1 && (counts[t3] || 0) >= 1) {
        const next = { ...counts };
        next[first] -= 1; next[t2] -= 1; next[t3] -= 1;
        const sub = findSets(next, needSets - 1);
        for (const s of sub) {
          results.push([{ type: 'shuntsu', tiles: [first, t2, t3] }, ...s]);
        }
      }
    }
  }
  return results;
}

function extractStandardPatterns(handTiles, melds = []) {
  const sorted = sortTiles(handTiles);
  const counts = countTiles(sorted);
  const patterns = [];
  const tileKeys = Object.keys(counts);
  
  for (const pairTile of tileKeys) {
    if (counts[pairTile] >= 2) {
      const remaining = { ...counts };
      remaining[pairTile] -= 2;
      const meldsCount = melds.length;
      const needSets = 4 - meldsCount;
      const setsList = findSets(remaining, needSets);
      
      for (const sets of setsList) {
        const allSets = [];
        const allTypes = [];
        const allAnkou = [];
        for (const meld of melds) {
          allSets.push(meld.tiles.map(t => tileBase(t)));
          if (meld.type === 'pon') { allTypes.push('koutsu'); allAnkou.push(false); }
          else if (meld.type === 'minkan' || meld.type === 'kakan') { allTypes.push('kantsu'); allAnkou.push(false); }
          else if (meld.type === 'ankan') { allTypes.push('kantsu'); allAnkou.push(true); }
          else if (meld.type === 'chi') { allTypes.push('shuntsu'); allAnkou.push(false); }
        }
        for (const set of sets) {
          allSets.push(set.tiles);
          allTypes.push(set.type);
          allAnkou.push(set.type !== 'shuntsu');
        }
        patterns.push({
          pairs: [[pairTile, pairTile]],
          sets: allSets,
          setTypes: allTypes,
          isAnkou: allAnkou,
        });
      }
    }
  }
  return patterns;
}

function isChiitoitsuPattern(handTiles, melds = []) {
  if (melds.length > 0) return null;
  if (handTiles.length !== 14) return null;
  const counts = countTiles(handTiles);
  const pairs = [];
  for (const k in counts) {
    if (counts[k] !== 2) return null;
    pairs.push([k, k]);
  }
  if (pairs.length !== 7) return null;
  return { type: 'chiitoitsu', pairs, sets: [], setTypes: [], isAnkou: [] };
}

function extractAllPatterns(handTiles, melds = []) {
  const all = [];
  all.push(...extractStandardPatterns(handTiles, melds));
  const chiito = isChiitoitsuPattern(handTiles, melds);
  if (chiito) all.push(chiito);
  return all;
}

// ============ FEVER ============
function isIndependentInPattern(pattern, winningTile, targetTile) {
  if (pattern.type === 'chiitoitsu' || pattern.type === 'kokushi') return false;
  let targetAnkouIndex = -1;
  for (let i = 0; i < pattern.sets.length; i++) {
    if (pattern.setTypes[i] === 'koutsu' && pattern.isAnkou[i] && tileBase(pattern.sets[i][0]) === targetTile) {
      targetAnkouIndex = i; break;
    }
  }
  if (targetAnkouIndex === -1) return false;
  const winBase = tileBase(winningTile);
  const pairTile = pattern.pairs[0] ? pattern.pairs[0][0] : null;
  if (pairTile && tileBase(pairTile) === winBase) return true;
  for (let i = 0; i < pattern.sets.length; i++) {
    const set = pattern.sets[i];
    if (set.some(t => tileBase(t) === winBase)) {
      return i !== targetAnkouIndex;
    }
  }
  return false;
}

function detectFeverType(finalHand, melds, winningTile) {
  const isMenzen = !melds || melds.every(m => m.type === 'ankan');
  if (!isMenzen) return null;
  const patterns = extractStandardPatterns(finalHand, melds);
  const p7 = patterns.some(p => isIndependentInPattern(p, winningTile, 'p7'));
  const m7 = patterns.some(p => isIndependentInPattern(p, winningTile, 'm7'));
  if (p7 && m7) return 'double';
  if (p7) return 'p7';
  if (m7) return 'm7';
  return null;
}

// ============ 役判定 ============
function windToTile(wind) {
  return { 'E': 'z1', 'S': 'z2', 'W': 'z3', 'N': 'z4' }[wind];
}
function isMenzen(melds) {
  if (!melds || melds.length === 0) return true;
  return melds.every(m => m.type === 'ankan');
}

function evaluateAllYaku(pattern, melds, kitaPulls, ctx) {
  const yakuList = [];
  
  if (ctx.isReached) {
    if (ctx.reachType === 'double') yakuList.push({ name: 'ダブル立直', han: 2 });
    else if (ctx.reachType === 'open' || ctx.feverActive) yakuList.push({ name: ctx.feverActive ? '立直 (FEVER)' : 'オープン立直', han: 2 });
    else yakuList.push({ name: '立直', han: 1 });
    
    if (ctx.ipatsuActive) yakuList.push({ name: '一発', han: 1 });
  }
  
  if (isMenzen(melds) && ctx.isTsumo) {
    yakuList.push({ name: '門前清自摸和', han: 1 });
  }
  
  // ピンフ
  if (isMenzen(melds) && pattern.type !== 'chiitoitsu') {
    const allShuntsu = pattern.setTypes.every(t => t === 'shuntsu');
    const pairTile = pattern.pairs[0][0];
    const pairBase = tileBase(pairTile);
    const isYakuhaiPair = ['z5','z6','z7','z4'].includes(pairBase) ||
      pairBase === windToTile(ctx.roundWind) ||
      pairBase === windToTile(ctx.seatWind);
    if (allShuntsu && !isYakuhaiPair && ctx.waitType === 'ryanmen') {
      yakuList.push({ name: '平和', han: 1 });
    }
  }
  
  // 役牌
  const allKoutsuTiles = [];
  pattern.sets.forEach((set, i) => {
    if (pattern.setTypes[i] === 'koutsu' || pattern.setTypes[i] === 'kantsu') {
      allKoutsuTiles.push(tileBase(set[0]));
    }
  });
  
  if (allKoutsuTiles.includes('z5')) yakuList.push({ name: '白', han: 1 });
  if (allKoutsuTiles.includes('z6')) yakuList.push({ name: '發', han: 1 });
  if (allKoutsuTiles.includes('z7')) yakuList.push({ name: '中', han: 1 });
  if (allKoutsuTiles.includes('z4')) yakuList.push({ name: '北', han: 1 });
  
  const roundWindTile = windToTile(ctx.roundWind);
  const seatWindTile = windToTile(ctx.seatWind);
  if (allKoutsuTiles.includes(roundWindTile) && roundWindTile !== 'z4') {
    const wn = { 'z1': '東', 'z2': '南', 'z3': '西' }[roundWindTile];
    yakuList.push({ name: `場風 ${wn}`, han: 1 });
  }
  // 自風：場風と同じ時もダブ東/ダブ南として計上
  if (seatWindTile !== 'z4' && allKoutsuTiles.includes(seatWindTile)) {
    const wn = { 'z1': '東', 'z2': '南', 'z3': '西' }[seatWindTile];
    yakuList.push({ name: `自風 ${wn}`, han: 1 });
  }
  
  // 北：役牌として1翻（北抜き3枚以上、または面前で北の暗刻）
  const isKitaPullThree = kitaPulls.length >= 3;
  const isMenzenKitaAnkou = isMenzen(melds) && pattern.sets.some((set, i) =>
    pattern.setTypes[i] === 'koutsu' && pattern.isAnkou[i] && set[0] === 'z4');
  if (isKitaPullThree || isMenzenKitaAnkou) {
    yakuList.push({ name: '北', han: 1 });
  }
  
  // タンヤオ
  if (isMenzen(melds)) {
    const allTiles = [];
    pattern.pairs.forEach(p => allTiles.push(...p));
    pattern.sets.forEach(s => allTiles.push(...s));
    if (allTiles.every(t => !isYaochuhai(t))) {
      yakuList.push({ name: '断ヤオ', han: 1 });
    }
  }
  
  if (pattern.type === 'chiitoitsu') {
    yakuList.push({ name: '七対子', han: 2 });
  }
  
  if (pattern.type !== 'chiitoitsu') {
    const allKoutsu = pattern.setTypes.every(t => t === 'koutsu' || t === 'kantsu');
    if (allKoutsu) yakuList.push({ name: '対々和', han: 2 });
  }
  
  // 全ての牌（手牌+副露）を集める：清一色・混一色判定用
  const allTilesAll = [];
  pattern.pairs.forEach(p => allTilesAll.push(...p));
  pattern.sets.forEach(s => allTilesAll.push(...s));
  melds.forEach(m => allTilesAll.push(...m.tiles));
  
  // 清一色（チンイツ）：字牌なし、数牌1種類のみ
  // 混一色（ホンイツ）：字牌あり、数牌1種類のみ
  if (pattern.type !== 'kokushi') {
    const suitsUsed = new Set();
    let hasJihai = false;
    allTilesAll.forEach(t => {
      const s = tileSuit(tileBase(t));
      if (s === 'z') hasJihai = true;
      else suitsUsed.add(s);
    });
    
    if (suitsUsed.size === 1 && !hasJihai) {
      // 清一色：面前6翻、副露5翻
      yakuList.push({ name: '清一色', han: isMenzen(melds) ? 6 : 5 });
    } else if (suitsUsed.size === 1 && hasJihai) {
      // 混一色：面前3翻、副露2翻
      yakuList.push({ name: '混一色', han: isMenzen(melds) ? 3 : 2 });
    }
  }
  
  // 一気通貫（イッキツウカン）：同色で 123, 456, 789 が揃う
  if (pattern.type !== 'chiitoitsu' && pattern.type !== 'kokushi') {
    for (const suit of ['m', 'p', 's']) {
      const lowSet = pattern.sets.findIndex((set, i) =>
        pattern.setTypes[i] === 'shuntsu' &&
        tileBase(set[0]) === `${suit}1` && tileBase(set[1]) === `${suit}2` && tileBase(set[2]) === `${suit}3`);
      const midSet = pattern.sets.findIndex((set, i) =>
        pattern.setTypes[i] === 'shuntsu' &&
        tileBase(set[0]) === `${suit}4` && tileBase(set[1]) === `${suit}5` && tileBase(set[2]) === `${suit}6`);
      const highSet = pattern.sets.findIndex((set, i) =>
        pattern.setTypes[i] === 'shuntsu' &&
        tileBase(set[0]) === `${suit}7` && tileBase(set[1]) === `${suit}8` && tileBase(set[2]) === `${suit}9`);
      
      // 副露の順子もチェック
      const meldShuntsuLow = melds.some(m => m.type === 'chi' &&
        tileBase(m.tiles[0]) === `${suit}1` && tileBase(m.tiles[1]) === `${suit}2` && tileBase(m.tiles[2]) === `${suit}3`);
      const meldShuntsuMid = melds.some(m => m.type === 'chi' &&
        tileBase(m.tiles[0]) === `${suit}4` && tileBase(m.tiles[1]) === `${suit}5` && tileBase(m.tiles[2]) === `${suit}6`);
      const meldShuntsuHigh = melds.some(m => m.type === 'chi' &&
        tileBase(m.tiles[0]) === `${suit}7` && tileBase(m.tiles[1]) === `${suit}8` && tileBase(m.tiles[2]) === `${suit}9`);
      
      const hasLow = lowSet >= 0 || meldShuntsuLow;
      const hasMid = midSet >= 0 || meldShuntsuMid;
      const hasHigh = highSet >= 0 || meldShuntsuHigh;
      
      if (hasLow && hasMid && hasHigh) {
        yakuList.push({ name: '一気通貫', han: isMenzen(melds) ? 2 : 1 });
        break;
      }
    }
  }
  
  // 三色同順：3つのスーツで同じ順子（FEVER MJは索子1と9だけだから事実上発動しない）
  // 純チャン・チャンタ（端牌絡み）
  if (pattern.type !== 'chiitoitsu' && pattern.type !== 'kokushi') {
    // 全面子と雀頭が老頭牌（1,9,字牌の刻子）または1-2-3 / 7-8-9 の順子
    const checkChanta = (mustTerminalOnly) => {
      // 雀頭チェック
      const pairTile = pattern.pairs[0] && pattern.pairs[0][0];
      if (!pairTile) return false;
      const pairBase = tileBase(pairTile);
      const pairIsTerminal = isYaochuhai(pairBase);
      const pairIsJihai = isJihai(pairBase);
      if (!pairIsTerminal) return false;
      if (mustTerminalOnly && pairIsJihai) return false;
      
      // 各セットチェック
      for (let i = 0; i < pattern.sets.length; i++) {
        const set = pattern.sets[i];
        const type = pattern.setTypes[i];
        if (type === 'shuntsu') {
          const nums = set.map(t => tileNumber(tileBase(t)));
          const sortedNums = [...nums].sort((a, b) => a - b);
          if (sortedNums[0] !== 1 && sortedNums[2] !== 9) return false;
        } else {
          // 刻子・カン
          if (!isYaochuhai(set[0])) return false;
          if (mustTerminalOnly && isJihai(set[0])) return false;
        }
      }
      // 副露もチェック
      for (const m of melds) {
        if (m.type === 'chi') {
          const nums = m.tiles.map(t => tileNumber(tileBase(t))).sort((a, b) => a - b);
          if (nums[0] !== 1 && nums[2] !== 9) return false;
        } else {
          if (!isYaochuhai(m.tiles[0])) return false;
          if (mustTerminalOnly && isJihai(m.tiles[0])) return false;
        }
      }
      return true;
    };
    
    if (checkChanta(true)) {
      // 純全帯ヤオ九（純チャン）：面前3翻、副露2翻
      yakuList.push({ name: '純全帯ヤオ九', han: isMenzen(melds) ? 3 : 2 });
    } else if (checkChanta(false)) {
      // 混全帯ヤオ九（チャンタ）：面前2翻、副露1翻
      // 雀頭か面子のどこかに字牌が含まれる必要あり
      const hasJihai = allTilesAll.some(t => isJihai(t));
      if (hasJihai) {
        yakuList.push({ name: '混全帯ヤオ九', han: isMenzen(melds) ? 2 : 1 });
      }
    }
  }
  
  let ankouCount = 0;
  pattern.sets.forEach((set, i) => {
    if (pattern.setTypes[i] === 'koutsu' && pattern.isAnkou[i]) {
      if (!ctx.isTsumo && set.some(t => tileBase(t) === tileBase(ctx.winningTile))) return;
      ankouCount++;
    }
  });
  // 暗カンも暗刻に含める
  melds.forEach(m => { if (m.type === 'ankan') ankouCount++; });
  
  if (ankouCount === 3) yakuList.push({ name: '三暗刻', han: 2 });
  if (ankouCount === 4 && isMenzen(melds)) {
    return { yakuList: [{ name: '四暗刻', han: 13 }], totalHan: 13, isYakuman: true, yakumanCount: 1 };
  }
  
  // ドラ
  const allTilesForDora = [];
  pattern.pairs.forEach(p => allTilesForDora.push(...p));
  pattern.sets.forEach(s => allTilesForDora.push(...s));
  melds.forEach(m => allTilesForDora.push(...m.tiles));
  
  let doraCount = 0;
  if (ctx.doraIndicators) {
    for (const ind of ctx.doraIndicators) {
      const doraTile = nextTile(ind);
      doraCount += allTilesForDora.filter(t => tileBase(t) === doraTile).length;
    }
  }
  doraCount += kitaPulls.length;
  if (doraCount > 0) yakuList.push({ name: `ドラ${doraCount}`, han: doraCount });
  
  const akaCount = allTilesForDora.filter(t => isRed(t)).length;
  if (akaCount > 0) yakuList.push({ name: `赤ドラ${akaCount}`, han: akaCount });
  
  const totalHan = yakuList.reduce((sum, y) => sum + y.han, 0);
  return { yakuList, totalHan, isYakuman: false, yakumanCount: 0 };
}

function nextTile(indicator) {
  const base = tileBase(indicator);
  const suit = tileSuit(base);
  if (isShuupai(base)) {
    const num = tileNumber(base);
    const next = num === 9 ? 1 : num + 1;
    return `${suit}${next}`;
  }
  if (suit === 'z') {
    const num = tileNumber(base);
    if (num >= 1 && num <= 4) return `z${num === 4 ? 1 : num + 1}`;
    if (num >= 5 && num <= 7) return `z${num === 7 ? 5 : num + 1}`;
  }
  return base;
}

function detectWaitType(pattern, winningTile) {
  const winBase = tileBase(winningTile);
  if (pattern.pairs[0] && tileBase(pattern.pairs[0][0]) === winBase) return 'tanki';
  for (let i = 0; i < pattern.sets.length; i++) {
    const set = pattern.sets[i];
    if (!set.some(t => tileBase(t) === winBase)) continue;
    if (pattern.setTypes[i] === 'koutsu') return 'shabo';
    if (pattern.setTypes[i] === 'shuntsu') {
      const positions = set.map(t => tileBase(t));
      const winPos = positions.indexOf(winBase);
      if (winPos === 1) return 'kanchan';
      const nums = positions.map(p => parseInt(p[1]));
      if ((winPos === 0 && nums[0] === 1) || (winPos === 2 && nums[2] === 9)) return 'penchan';
      return 'ryanmen';
    }
  }
  return 'ryanmen';
}

function calculateSimpleScore(han, isParent, isTsumo) {
  let basePoint;
  if (han >= 13) basePoint = 8000;
  else if (han >= 11) basePoint = 6000;
  else if (han >= 8) basePoint = 4000;
  else if (han >= 6) basePoint = 3000;
  else if (han >= 5) basePoint = 2000;
  else basePoint = Math.min(30 * Math.pow(2, han + 2), 2000);
  
  let total;
  if (isParent) {
    total = isTsumo ? basePoint * 2 * 2 : basePoint * 6;
  } else {
    total = isTsumo ? basePoint * 2 + basePoint * 1 : basePoint * 4;
  }
  return Math.ceil(total / 100) * 100;
}

function isTenpai(hand, melds = []) {
  const allTiles = [
    'm1','m2','m3','m4','m5','m6','m7','m8','m9',
    'p1','p2','p3','p4','p5','p6','p7','p8','p9',
    's1','s9',
    'z1','z2','z3','z4','z5','z6','z7',
  ];
  for (const t of allTiles) {
    const test = [...hand, t];
    const patterns = extractAllPatterns(test, melds);
    if (patterns.length > 0) return true;
  }
  return false;
}

function getWaitingTiles(hand, melds = []) {
  const allTiles = [
    'm1','m2','m3','m4','m5','m6','m7','m8','m9',
    'p1','p2','p3','p4','p5','p6','p7','p8','p9',
    's1','s9',
    'z1','z2','z3','z4','z5','z6','z7',
  ];
  const waits = [];
  for (const t of allTiles) {
    const test = [...hand, t];
    const patterns = extractAllPatterns(test, melds);
    if (patterns.length > 0) waits.push(t);
  }
  return waits;
}

// =========================================================================
// シングルプレイ ゲームエンジン
// =========================================================================

const game = {
  state: null,
  
  init(carryOver = null) {
    const tiles = buildTileSet();
    for (let i = tiles.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [tiles[i], tiles[j]] = [tiles[j], tiles[i]];
    }
    
    // 前回の点数・チップ・本場・親・局を引き継ぎ
    const carryScores = carryOver ? carryOver.scores : [25000, 25000, 25000];
    const carryChips = carryOver ? carryOver.chips : [100, 100, 100];
    const carryRound = carryOver ? carryOver.roundWind : 'E';
    const carryHand = carryOver ? carryOver.hand : 1;
    const carryHonba = carryOver ? carryOver.honba : 0;
    const carryReachSticks = carryOver ? carryOver.reachSticks : 0;
    const carryDealerId = carryOver ? carryOver.dealerId : 'P0';
    
    // 自風は親に応じて決まる（3人麻雀：東家・南家・西家）
    const dealerIdx = parseInt(carryDealerId.slice(1));
    const windsOrder = ['E', 'S', 'W'];
    const getWind = (playerIdx) => windsOrder[(playerIdx - dealerIdx + 3) % 3];
    
    const players = [
      { id: 'P0', name: 'あなた', wind: getWind(0), score: carryScores[0], chips: carryChips[0],
        hand: [], discards: [], melds: [], kitaPulls: [],
        isReached: false, ipatsuActive: false,
        feverActive: false, feverTrigger: null,
        missedRonTiles: [], kitaRinshanActive: false,
        isCpu: false },
      { id: 'P1', name: 'CPU 1', wind: getWind(1), score: carryScores[1], chips: carryChips[1],
        hand: [], discards: [], melds: [], kitaPulls: [],
        isReached: false, ipatsuActive: false,
        feverActive: false, feverTrigger: null,
        missedRonTiles: [], kitaRinshanActive: false,
        isCpu: true },
      { id: 'P2', name: 'CPU 2', wind: getWind(2), score: carryScores[2], chips: carryChips[2],
        hand: [], discards: [], melds: [], kitaPulls: [],
        isReached: false, ipatsuActive: false,
        feverActive: false, feverTrigger: null,
        missedRonTiles: [], kitaRinshanActive: false,
        isCpu: true },
    ];
    
    let cursor = 0;
    for (let i = 0; i < 13; i++) {
      players.forEach(p => p.hand.push(tiles[cursor++]));
    }
    
    const wallEnd = tiles.length - 14;
    const liveTiles = tiles.slice(cursor, wallEnd);
    const deadTiles = tiles.slice(wallEnd);
    
    this.state = {
      players,
      wall: liveTiles,
      deadTiles,
      doraIndicators: [deadTiles[0], deadTiles[2]],
      uraDoraIndicators: [deadTiles[1], deadTiles[3]],
      rinshanIndex: 4,
      currentTurn: carryDealerId,
      dealerId: carryDealerId,
      roundWind: carryRound,
      hand: carryHand,
      reachSticks: carryReachSticks,
      honba: carryHonba,
      warePlayer: 'P' + Math.floor(Math.random() * 3),
      drawnTile: null,
      lastDiscard: null,
      phase: 'init',
    };
    
    players[0].hand = sortTiles(players[0].hand);
    return this.state;
  },
  
  drawTile(playerId) {
    if (this.state.wall.length === 0) {
      return { drawn: null, ryukyoku: true };
    }
    const player = this.state.players.find(p => p.id === playerId);
    
    // 多牌防止：すでに14枚以上ある場合はツモせず警告
    const expectedHandSize = 13 - player.melds.length * 3;
    if (player.hand.length > expectedHandSize) {
      console.warn(`多牌防止: ${playerId}の手牌は既に${player.hand.length}枚（期待値${expectedHandSize}枚）`);
      return { drawn: player.hand[player.hand.length - 1], ryukyoku: false };
    }
    
    const tile = this.state.wall.shift();
    player.hand.push(tile);
    if (!player.isCpu) {
      const sortedExceptLast = sortTiles(player.hand.slice(0, -1));
      player.hand = [...sortedExceptLast, tile];
    }
    return { drawn: tile, ryukyoku: false };
  },
  
  drawRinshan(playerId) {
    if (this.state.rinshanIndex >= this.state.deadTiles.length) return null;
    const player = this.state.players.find(p => p.id === playerId);
    
    // 多牌防止：嶺上ツモ前に14枚以上あれば異常
    const expectedHandSize = 13 - player.melds.length * 3;
    if (player.hand.length > expectedHandSize) {
      console.warn(`嶺上ツモ多牌防止: ${playerId}の手牌は既に${player.hand.length}枚（期待値${expectedHandSize}枚）`);
      return player.hand[player.hand.length - 1];
    }
    
    // 山から1枚減らす（牌補充の代わり）
    if (this.state.wall.length > 0) {
      this.state.wall.pop();
    }
    const tile = this.state.deadTiles[this.state.rinshanIndex++];
    player.hand.push(tile);
    if (!player.isCpu) {
      const sortedExceptLast = sortTiles(player.hand.slice(0, -1));
      player.hand = [...sortedExceptLast, tile];
    }
    return tile;
  },
  
  discardTile(playerId, tile, isTsumogiri, handIdx = null) {
    const player = this.state.players.find(p => p.id === playerId);
    let idx;
    // handIdxが指定されてればそれを使う（同じ牌が複数ある場合の正確性のため）
    if (handIdx !== null && handIdx >= 0 && handIdx < player.hand.length && player.hand[handIdx] === tile) {
      idx = handIdx;
    } else {
      idx = player.hand.findIndex(t => t === tile);
    }
    if (idx === -1) return false;
    player.hand.splice(idx, 1);
    if (!player.isCpu) {
      player.hand = sortTiles(player.hand);
    }
    player.discards.push({
      tile,
      isTsumogiri,
      isCalled: false,
      isReachDeclaration: player.justDeclaredReach || false,
    });
    
    if (player.justDeclaredReach) {
      player.justDeclaredReach = false;
      // リーチ打牌後：13枚になった手牌で待ち牌を確定
      player.reachWaits = getWaitingTiles(player.hand, player.melds);
      // リーチ宣言と同時の打牌では一発はまだ消えない（次のツモまで有効）
    } else if (player.isReached && player.ipatsuActive) {
      // リーチ後の通常打牌（嶺上ツモ後の打牌含む）で一発消滅
      player.ipatsuActive = false;
    }
    
    this.state.lastDiscard = { player: playerId, tile };
    return true;
  },
  
  declareReach(playerId, reachType = 'normal', discardTile = null) {
    const player = this.state.players.find(p => p.id === playerId);
    player.isReached = true;
    player.reachType = reachType;
    player.score -= 1000;
    this.state.reachSticks++;
    player.ipatsuActive = true;
    player.justDeclaredReach = true;
    player.reachWaits = [];  // 打牌後にdiscardTileで確定する
    
    // FEVER判定は「リーチ宣言の打牌後の13枚」=面前で判定する
    // discardTileが指定されていればその牌を1枚除外、なければ現状の手牌で判定
    // （ツモ切りでツモ牌をそのまま捨ててリーチ等のケース）
    let handForCheck = [...player.hand];
    if (discardTile !== null) {
      const idx = handForCheck.findIndex(t => t === discardTile);
      if (idx >= 0) handForCheck.splice(idx, 1);
    }
    const p7Count = handForCheck.filter(t => tileBase(t) === 'p7').length;
    const m7Count = handForCheck.filter(t => tileBase(t) === 'm7').length;
    let trigger = null;
    if (p7Count >= 3 && m7Count >= 3) trigger = 'double';
    else if (p7Count >= 3) trigger = 'p7';
    else if (m7Count >= 3) trigger = 'm7';
    if (trigger) {
      player.feverActive = true;
      player.feverTrigger = trigger;
    }
    return { trigger };
  },
  
  // 一発消滅
  consumeIpatsu(triggerPlayerId) {
    this.state.players.forEach(p => {
      if (p.id !== triggerPlayerId && p.ipatsuActive) {
        p.ipatsuActive = false;
      }
    });
  },
  
  checkAgariTsumo(playerId, drawnTile) {
    const player = this.state.players.find(p => p.id === playerId);
    
    // 白ジョーカー：リーチ一発中に白をツモった場合は強制アガリ
    if (tileBase(drawnTile) === 'z5' && player.isReached && player.ipatsuActive) {
      return this.createHakuJokerResult(player, drawnTile);
    }
    
    const finalHand = player.hand;
    const patterns = extractAllPatterns(finalHand, player.melds);
    if (patterns.length === 0) return null;
    
    let bestResult = null;
    for (const pattern of patterns) {
      const waitType = detectWaitType(pattern, drawnTile);
      const yakuResult = evaluateAllYaku(pattern, player.melds, player.kitaPulls, {
        isReached: player.isReached,
        reachType: player.reachType,
        ipatsuActive: player.ipatsuActive,
        feverActive: player.feverActive,
        isTsumo: true,
        winningTile: drawnTile,
        roundWind: this.state.roundWind,
        seatWind: player.wind,
        waitType,
        doraIndicators: this.state.doraIndicators,
      });
      if (yakuResult.totalHan === 0 && !yakuResult.isYakuman) continue;
      // 完全先付け：ドラのみのアガリは不可
      // ドラ系（ドラ・赤ドラ・裏ドラ・北抜きドラ）を除いた本来の役が必要
      const nonDoraYaku = yakuResult.yakuList.filter(y => 
        !y.name.startsWith('ドラ') && 
        !y.name.startsWith('赤ドラ') && 
        !y.name.startsWith('裏ドラ') &&
        !y.name.startsWith('抜きドラ') &&
        !y.name.startsWith('北抜きドラ')
      );
      if (nonDoraYaku.length === 0 && !yakuResult.isYakuman) continue;
      if (!bestResult || yakuResult.totalHan > bestResult.yakuResult.totalHan) {
        bestResult = { pattern, yakuResult, waitType };
      }
    }
    return bestResult;
  },
  
  // 白ジョーカー：リーチ一発ツモで白を引いた場合の強制アガリ
  createHakuJokerResult(player, drawnTile) {
    // 基本役：立直 + 一発 + 門前清自摸和 + 白（ジョーカー）
    const yakuList = [
      { name: '立直', han: player.reachType === 'open' ? 2 : 1 },
      { name: '一発', han: 1 },
      { name: '門前清自摸和', han: 1 },
      { name: '白 (ジョーカー)', han: 1 },
    ];
    
    // 手牌の役を追加判定（白を雀頭または刻子の一部として扱う）
    // 残り12枚の手牌から、4面子1雀頭を構成できるか試す
    const handWithoutHaku = [...player.hand];
    // 白(z5)はジョーカーなので、雀頭として使うか、刻子として使うか試行
    // 簡易実装：手牌12枚 + 白2枚（仮想）で14枚として通常評価
    const virtualHand = [...handWithoutHaku, 'z5', 'z5'];
    const patterns = extractAllPatterns(virtualHand, player.melds);
    
    let bestExtra = { yakuList: [], totalHan: 0 };
    for (const pattern of patterns) {
      const waitType = detectWaitType(pattern, 'z5');
      const yakuResult = evaluateAllYaku(pattern, player.melds, player.kitaPulls, {
        isReached: false,  // 立直・一発・ツモ・白は既に上で追加済みなので
        reachType: null,
        ipatsuActive: false,
        feverActive: false,
        isTsumo: false,    // 自摸も上で追加済み
        winningTile: 'z5',
        roundWind: this.state.roundWind,
        seatWind: player.wind,
        waitType,
        doraIndicators: this.state.doraIndicators,
      });
      // 白の役牌は yakuList で出てくるはずだが、既に「白(ジョーカー)」で計上済みなので除外
      const filtered = yakuResult.yakuList.filter(y => y.name !== '白' && y.name !== 'ドラ' && !y.name.startsWith('ドラ'));
      const filteredHan = filtered.reduce((sum, y) => sum + y.han, 0);
      if (filteredHan > bestExtra.totalHan) {
        bestExtra = { yakuList: filtered, totalHan: filteredHan, pattern };
      }
    }
    
    // 追加役を統合
    bestExtra.yakuList.forEach(y => yakuList.push(y));
    
    // ドラ計算（通常の手牌のドラ + 北抜き）
    let doraCount = 0;
    if (this.state.doraIndicators) {
      const allTiles = [...player.hand];
      for (const ind of this.state.doraIndicators) {
        const doraTile = nextTile(ind);
        doraCount += allTiles.filter(t => tileBase(t) === doraTile).length;
      }
    }
    // 赤ドラ
    doraCount += player.hand.filter(t => typeof isRed === 'function' && isRed(t)).length;
    // 北抜き
    doraCount += (player.kitaPulls || []).length;
    if (doraCount > 0) yakuList.push({ name: `ドラ${doraCount}`, han: doraCount });
    
    const totalHan = yakuList.reduce((sum, y) => sum + y.han, 0);
    
    return {
      pattern: bestExtra.pattern || { type: 'haku_joker', sets: [], pairs: [], setTypes: [] },
      yakuResult: { yakuList, totalHan, isYakuman: false },
      waitType: 'tanki',
      isHakuJoker: true,
    };
  },
  
  checkAgariRon(playerId, winningTile, fromPlayer) {
    const player = this.state.players.find(p => p.id === playerId);
    const finalHand = [...player.hand, winningTile];
    const patterns = extractAllPatterns(finalHand, player.melds);
    if (patterns.length === 0) return null;
    
    // フリテンチェック
    const waitTiles = getWaitingTiles(player.hand, player.melds);
    const ownDiscards = player.discards.map(d => tileBase(d.tile));
    const isFuriten = waitTiles.some(w => ownDiscards.includes(tileBase(w)));
    const hasMissedRon = (player.missedRonTiles || []).map(t => tileBase(t)).includes(tileBase(winningTile));
    
    if (isFuriten || hasMissedRon) return { canRon: false, reason: 'furiten' };
    if (player.reachType === 'furiten') return { canRon: false, reason: 'furiten_reach' };
    
    let bestResult = null;
    for (const pattern of patterns) {
      const waitType = detectWaitType(pattern, winningTile);
      const yakuResult = evaluateAllYaku(pattern, player.melds, player.kitaPulls, {
        isReached: player.isReached,
        reachType: player.reachType,
        ipatsuActive: player.ipatsuActive,
        feverActive: player.feverActive,
        isTsumo: false,
        winningTile,
        roundWind: this.state.roundWind,
        seatWind: player.wind,
        waitType,
        doraIndicators: this.state.doraIndicators,
      });
      if (yakuResult.totalHan === 0 && !yakuResult.isYakuman) continue;
      // 完全先付け：ドラのみのアガリは不可
      const nonDoraYaku = yakuResult.yakuList.filter(y => 
        !y.name.startsWith('ドラ') && 
        !y.name.startsWith('赤ドラ') && 
        !y.name.startsWith('裏ドラ') &&
        !y.name.startsWith('抜きドラ') &&
        !y.name.startsWith('北抜きドラ')
      );
      if (nonDoraYaku.length === 0 && !yakuResult.isYakuman) continue;
      if (!bestResult || yakuResult.totalHan > bestResult.yakuResult.totalHan) {
        bestResult = { pattern, yakuResult, waitType };
      }
    }
    if (!bestResult) return null;
    return { canRon: true, ...bestResult };
  },
  
  // ポン可能か
  canPon(playerId, tile) {
    const player = this.state.players.find(p => p.id === playerId);
    if (player.isReached) return false;
    // 他家がFEVER中の場合、自分がFEVER前にリーチ済みでなければ鳴き不可
    const anyOtherFever = this.state.players.some(p => p.id !== playerId && p.feverActive);
    if (anyOtherFever && !player.isReached) return false;
    const base = tileBase(tile);
    const sameInHand = player.hand.filter(t => tileBase(t) === base).length;
    return sameInHand >= 2;
  },
  
  // ポン実行
  doPon(playerId, tile, fromPlayer) {
    const player = this.state.players.find(p => p.id === playerId);
    const base = tileBase(tile);
    const sameTiles = player.hand.filter(t => tileBase(t) === base);
    
    // 2枚を手牌から取り除く
    const usedFromHand = sameTiles.slice(0, 2);
    let removed = 0;
    player.hand = player.hand.filter(t => {
      if (tileBase(t) === base && removed < 2) {
        removed++;
        return false;
      }
      return true;
    });
    
    // 副露に追加
    player.melds.push({
      type: 'pon',
      tiles: [...usedFromHand, tile],
      fromPlayer,
    });
    
    // 鳴かれた牌は鳴き対象として河からは除外しない（フラグだけ立てる）
    const fromPlayerObj = this.state.players.find(p => p.id === fromPlayer);
    const lastDisc = fromPlayerObj.discards[fromPlayerObj.discards.length - 1];
    if (lastDisc) lastDisc.isCalled = true;
    
    // 鳴いたら次のターンはこのプレイヤー
    this.state.currentTurn = playerId;
    
    // 一発消滅（リーチ者全員）
    this.consumeIpatsu(playerId);
    
    if (!player.isCpu) {
      player.hand = sortTiles(player.hand);
    }
  },
  
  // 暗カン可能か（手牌に4枚あるか）
  getAnkanCandidates(playerId) {
    const player = this.state.players.find(p => p.id === playerId);
    const counts = countTiles(player.hand);
    const candidates = [];
    for (const k in counts) {
      if (counts[k] >= 4) {
        // リーチ後は待ちが変わらない暗カンのみOK
        if (player.isReached) {
          const currentWaits = (player.reachWaits || []).map(t => tileBase(t)).sort().join(',');
          // 待ち牌そのものを暗カンするのはNG
          if ((player.reachWaits || []).some(w => tileBase(w) === k)) continue;
          // 暗カン4枚を抜いた手牌で、副露として暗カン追加した待ちを判定
          const handMinusKan = player.hand.filter(t => tileBase(t) !== k);
          const testMelds = [...player.melds, { type: 'ankan', tiles: [k, k, k, k] }];
          const newWaits = getWaitingTiles(handMinusKan, testMelds).map(t => tileBase(t)).sort().join(',');
          if (newWaits !== currentWaits) continue;  // 待ちが変わる
        }
        candidates.push(k);
      }
    }
    return candidates;
  },
  
  // 加カン可能か（既にポンしている牌と同じものが手牌にある）
  getKakanCandidates(playerId) {
    const player = this.state.players.find(p => p.id === playerId);
    const candidates = [];
    for (const meld of player.melds) {
      if (meld.type === 'pon') {
        const base = tileBase(meld.tiles[0]);
        if (player.hand.some(t => tileBase(t) === base)) {
          // リーチ後は待ちが変わらない加カンのみOK
          if (player.isReached) {
            const currentWaits = (player.reachWaits || []).map(t => tileBase(t)).sort().join(',');
            if ((player.reachWaits || []).some(w => tileBase(w) === base)) continue;
            const handMinusBase = player.hand.filter(t => tileBase(t) !== base);
            const testMelds = player.melds.map(m =>
              (m === meld) ? { type: 'ankan', tiles: [base, base, base, base] } : m
            );
            const newWaits = getWaitingTiles(handMinusBase, testMelds).map(t => tileBase(t)).sort().join(',');
            if (newWaits !== currentWaits) continue;
          }
          candidates.push(base);
        }
      }
    }
    return candidates;
  },
  
  // 明カン可能か（他家の打牌に対して）
  canMinkan(playerId, tile) {
    const player = this.state.players.find(p => p.id === playerId);
    if (player.isReached) return false;
    // 他家がFEVER中の場合、未リーチなら鳴き不可
    const anyOtherFever = this.state.players.some(p => p.id !== playerId && p.feverActive);
    if (anyOtherFever && !player.isReached) return false;
    const base = tileBase(tile);
    const sameInHand = player.hand.filter(t => tileBase(t) === base).length;
    return sameInHand >= 3;
  },
  
  doAnkan(playerId, baseTile) {
    const player = this.state.players.find(p => p.id === playerId);
    const tilesInHand = player.hand.filter(t => tileBase(t) === baseTile);
    if (tilesInHand.length < 4) return false;
    
    let removed = 0;
    player.hand = player.hand.filter(t => {
      if (tileBase(t) === baseTile && removed < 4) {
        removed++;
        return false;
      }
      return true;
    });
    
    player.melds.push({
      type: 'ankan',
      tiles: tilesInHand.slice(0, 4),
      fromPlayer: null,
    });
    
    // 暗カンでカンドラ即めくり
    if (this.state.rinshanIndex < this.state.deadTiles.length - 4) {
      this.state.doraIndicators.push(this.state.deadTiles[this.state.doraIndicators.length * 2 + 4]);
    }
    
    if (!player.isCpu) {
      player.hand = sortTiles(player.hand);
    }
    return true;

  doKakan(playerId, baseTile) {
    const player = this.state.players.find(p => p.id === playerId);
    const ponMeld = player.melds.find(m => m.type === 'pon' && tileBase(m.tiles[0]) === baseTile);
    if (!ponMeld) return false;
    
    const tileIdx = player.hand.findIndex(t => tileBase(t) === baseTile);
    if (tileIdx === -1) return false;
    
    const addedTile = player.hand[tileIdx];
    player.hand.splice(tileIdx, 1);
    
    // ポンを加カンに変換
    ponMeld.type = 'kakan';
    ponMeld.tiles.push(addedTile);
    
    // 一発消滅
    this.consumeIpatsu(playerId);
    
    if (!player.isCpu) {
      player.hand = sortTiles(player.hand);
    }
    return true;
  },
  
  doMinkan(playerId, tile, fromPlayer) {

  // 北抜き

  // CPU打牌AI
  cpuChooseDiscard(player) {
    const hand = player.hand;
    if (player.isReached) {
      // リーチ中はツモ切り（最後の牌が北なら避ける必要があるが、リーチ中は北抜きできないので捨てる）
      // しかしリーチ後の北は不可侵：通常の他の牌を返す
      const lastTile = hand[hand.length - 1];
      if (lastTile === 'z4') {
        // 北は河に出せないので、北以外を選ぶ。リーチ中はそもそもツモ切りだが、
        // 北だけは捨てられないのでリーチ確定時に北を含まない手にしている前提
        // 念のため：北以外の最初の牌
        for (const t of hand) {
          if (t !== 'z4') return t;
        }
      }
      return lastTile;
    }
    
    // 北は河に捨てない（cpuDoActionで先に北抜きが優先処理されるが、念のため除外）
    const candidates = hand
      .filter(t => t !== 'z4')
      .map(t => {
        const base = tileBase(t);
        const counts = countTiles(hand);
        let score = 0;
        
        if (isJihai(base) && counts[base] === 1) score += 100;
        if (isShuupai(base)) {
          const n = tileNumber(base);
          if ((n === 1 || n === 9) && counts[base] === 1) score += 80;
          const suit = tileSuit(base);
          const adj = [`${suit}${n-1}`, `${suit}${n+1}`, `${suit}${n-2}`, `${suit}${n+2}`];
          const adjCount = adj.filter(x => counts[x]).length;
          score -= adjCount * 10;
        }
        if (counts[base] >= 2) score -= 50;
        if (base === 'p7' || base === 'm7') score -= 30;
        
        return { tile: t, score };
      });
    
    if (candidates.length === 0) {
      // 全て北だった場合（ありえないが念のため）
      return hand[0];
    }
    
    candidates.sort((a, b) => b.score - a.score);
    return candidates[0].tile;
  },
  
  // リーチ判定（14枚状態で）- フリテンも検出
  // 戻り値: false | { discardIdx, discardTile, isFuriten }
  cpuCheckReach(player) {
    if (player.isReached) return false;
    if (player.score < 1000) return false;
    if (this.state.wall.length < 4) return false;
    if (player.melds.some(m => m.type !== 'ankan')) return false;
    
    let bestNonFuriten = null;
    let bestFuriten = null;
    
    for (let i = 0; i < player.hand.length; i++) {
      // 北は河に捨てられないので、北を切るリーチも除外
      if (player.hand[i] === 'z4') continue;
      
      const test = [...player.hand];
      test.splice(i, 1);
      if (isTenpai(test, player.melds)) {
        const waits = getWaitingTiles(test, player.melds);
        const ownDiscards = player.discards.map(d => tileBase(d.tile));
        const isFuriten = waits.some(w => ownDiscards.includes(tileBase(w)));
        
        if (!isFuriten && !bestNonFuriten) {
          bestNonFuriten = { discardIdx: i, discardTile: player.hand[i], isFuriten: false };
        }
        if (isFuriten && !bestFuriten) {
          bestFuriten = { discardIdx: i, discardTile: player.hand[i], isFuriten: true };
        }
      }
    }
    
    // 通常リーチ可能ならそれを優先、ダメならフリテンリーチも返す
    return bestNonFuriten || bestFuriten || false;
  },
  
  // FEVER可能判定（リーチ可能でかつ七筒or七萬の暗刻あり）
  // 戻り値: null | { trigger: 'p7'|'m7'|'double', discardOptions: [{discardIdx, discardTile}, ...] }
  checkFeverOption(playerId) {
    const player = this.state.players.find(p => p.id === playerId);
    if (player.isReached) return null;
    if (player.score < 1000) return null;
    if (this.state.wall.length < 4) return null;
    if (player.melds.some(m => m.type !== 'ankan')) return null;
    
    // 七筒/七萬の暗刻が手牌にあるか（副露は除外）
    const p7Count = player.hand.filter(t => tileBase(t) === 'p7').length;
    const m7Count = player.hand.filter(t => tileBase(t) === 'm7').length;
    
    let trigger = null;
    if (p7Count >= 3 && m7Count >= 3) trigger = 'double';
    else if (p7Count >= 3) trigger = 'p7';
    else if (m7Count >= 3) trigger = 'm7';
    if (!trigger) return null;
    
    // テンパイになる打牌候補を全部探す
    const discardOptions = [];
    for (let i = 0; i < player.hand.length; i++) {
      const tile = player.hand[i];
      // 七筒/七萬の暗刻を崩す打牌は除外
      if (trigger === 'p7' && tileBase(tile) === 'p7' && p7Count <= 3) continue;
      if (trigger === 'm7' && tileBase(tile) === 'm7' && m7Count <= 3) continue;
      if (trigger === 'double') {
        if (tileBase(tile) === 'p7' && p7Count <= 3) continue;
        if (tileBase(tile) === 'm7' && m7Count <= 3) continue;
      }
      
      const test = [...player.hand];
      test.splice(i, 1);
      if (isTenpai(test, player.melds)) {
        const waits = getWaitingTiles(test, player.melds);
        const ownDiscards = player.discards.map(d => tileBase(d.tile));
        const isFuriten = waits.some(w => ownDiscards.includes(tileBase(w)));
        if (isFuriten) continue;
        
        discardOptions.push({ discardIdx: i, discardTile: tile });
      }
    }
    
    if (discardOptions.length === 0) return null;
    return { trigger, discardOptions };
  },
  
  // 北抜き候補（手牌に北があるか）
  hasKita(playerId) {
    const player = this.state.players.find(p => p.id === playerId);
    return player.hand.includes('z4');
  },
  
  nextTurn() {
    const order = ['P0', 'P1', 'P2'];
    const idx = order.indexOf(this.state.currentTurn);
    this.state.currentTurn = order[(idx + 1) % 3];
  },
};

    document.getElementById('start-screen').classList.add('hide');

    game.init(carryOver);

  // 次局へ：今の状態から点数・局・本場を引き継ぐ
  nextHand(wasAgari, agariPlayerId, wasDealer) {
    const s = game.state;
    let nextDealer = s.dealerId;
    let nextHand = s.hand;
    let nextHonba = s.honba;
    let nextRound = s.roundWind;
    
    if (wasAgari) {
      // 親の和了：連荘＋本場+1
      if (wasDealer) {
        nextHonba++;
      } else {
        // 親流れ
        const dealerIdx = parseInt(s.dealerId.slice(1));
        const nextDealerIdx = (dealerIdx + 1) % 3;
        nextDealer = 'P' + nextDealerIdx;
        nextHand++;
        nextHonba = 0;
        if (nextHand > 3) {
          if (nextRound === 'E') {
            nextRound = 'S';
            nextHand = 1;
          } else {
            // 南3局終了：ゲーム終了
            this.showFinalResult();
            return;
          }
        }
      }
    } else {
      // 流局：テンパイ連荘（東場：テンパイ連荘、南場：ノーテン連荘）
      const me = s.players.find(p => p.id === s.dealerId);
      const dealerTenpai = me.isReached || isTenpai(me.hand, me.melds);
      const isNanba = s.roundWind === 'S';
      const isOorasu = isNanba && s.hand === 3;
      
      let renchan;
      if (isOorasu) {
        renchan = dealerTenpai;
      } else if (isNanba) {
        renchan = true; // ノーテンでも連荘
      } else {
        renchan = dealerTenpai;
      }
      
      if (renchan) {
        nextHonba++;
      } else {
        const dealerIdx = parseInt(s.dealerId.slice(1));
        const nextDealerIdx = (dealerIdx + 1) % 3;
        nextDealer = 'P' + nextDealerIdx;
        nextHand++;
        nextHonba++;  // 流局は本場+1
        if (nextHand > 3) {
          if (nextRound === 'E') {
            nextRound = 'S';
            nextHand = 1;
          } else {
            this.showFinalResult();
            return;
          }
        }
      }
    }
    
    const carryOver = {
      scores: s.players.map(p => p.score),
      chips: s.players.map(p => p.chips),
      roundWind: nextRound,
      hand: nextHand,
      honba: nextHonba,
      reachSticks: s.reachSticks,
      dealerId: nextDealer,
    };
    
    this.startGame(carryOver);

  renderMyHand() {
    const me = game.state.players[0];
    const handRow = document.getElementById('my-hand');
    handRow.innerHTML = '';
    
    const isMyTurn = game.state.currentTurn === 'P0' && game.state.phase === 'wait_discard';
    const handLen = me.hand.length;
    const tsumoIdx = (handLen === 14 || handLen === 11 || handLen === 8 || handLen === 5 || handLen === 2) ? handLen - 1 : -1;
    
    // テンパイ時の危険牌チェック（14枚状態でテンパイしてる場合）
    // 切るとテンパイが崩れる牌を判定
    const dangerSet = new Set();
    const tenpaiWaits = new Set();  // 現在のテンパイ待ち牌
    if (!me.isReached && isMyTurn && tsumoIdx >= 0) {
      for (let i = 0; i < me.hand.length; i++) {
        const test = [...me.hand];
        test.splice(i, 1);
        if (!isTenpai(test, me.melds)) {
          dangerSet.add(i);  // これを切るとテンパイ崩れ
        } else {
          // テンパイ維持できる場合、待ち牌を記録
          const waits = getWaitingTiles(test, me.melds);
          waits.forEach(w => tenpaiWaits.add(tileBase(w)));
        }
      }
    }
    
    // 現在の手牌がテンパイかどうか
    const currentlyTenpai = dangerSet.size < me.hand.length;
    
    me.hand.forEach((tile, i) => {
      const tileEl = this.makeTile(tile, 'large');
      if (i === tsumoIdx) {
        tileEl.classList.add('tsumo-tile');
      }
      
      // テンパイ時の危険牌マーキング
      if (currentlyTenpai && dangerSet.has(i) && !me.isReached) {
        tileEl.classList.add('danger-tile');
      }
      
      if (isMyTurn && !me.isReached) {
        tileEl.classList.add('selectable');
        tileEl.addEventListener('click', () => this.handleDiscard(i, tile));
      } else if (isMyTurn && me.isReached && i === tsumoIdx) {
        tileEl.classList.add('selectable');
        tileEl.addEventListener('click', () => this.handleDiscard(i, tile));
      }
      
      // リーチ後：待ち牌をシアン枠で表示（手牌全体に待ち牌マーク）
      if (me.isReached && me.reachWaits && me.reachWaits.length > 0) {
        const isWaitTile = me.reachWaits.some(w => tileBase(w) === tileBase(tile));
        if (isWaitTile) {
          tileEl.classList.add('reach-wait-tile');
        }
      }
      
      handRow.appendChild(tileEl);
    });
  },
  
  renderKawa(elId, discards, lastDiscard) {
    const el = document.getElementById(elId);
    const rows = el.querySelectorAll('.kawa-row');

    const visibleDiscards = discards.filter(d => !d.isCalled);
    visibleDiscards.forEach((d, i) => {
      const rowIdx = Math.floor(i / 6);
      if (rowIdx >= 3) return;
      const row = rows[rowIdx];
      const tileEl = this.makeTile(d.tile, 'kawa-tile');
      if (d.isReachDeclaration) tileEl.classList.add('reach-tile');
      if (d.isTsumogiri) tileEl.classList.add('tsumogiri');
      row.appendChild(tileEl);
    });

  renderMyKawa(discards, lastDiscard) {
    const el = document.getElementById('my-kawa');
    const rows = el.querySelectorAll('.my-kawa-row');
    rows.forEach(r => r.innerHTML = '');
    const visibleDiscards = discards.filter(d => !d.isCalled);
    visibleDiscards.forEach((d, i) => {
      const rowIdx = Math.floor(i / 10);
      if (rowIdx >= 2) return;

    const suit = tileSuit(tile);
    el.className = `tile ${sizeClass} suit-${suit}`;
    if (isRed(tile)) el.classList.add('red');
    
    const base = tileBase(tile);
    // FEVER牌（7萬・7筒）は金枠
    if (base === 'm7' || base === 'p7') {
      el.classList.add('fever-tile');
    }
    
    // 字牌
    if (suit === 'z') {
      const map = {
        'z1': '東', 'z2': '南', 'z3': '西', 'z4': '北',
        'z5': '白', 'z6': '發', 'z7': '中'
      };
      const main = document.createElement('div');
      main.className = 'tile-jihai';
      if (base === 'z6') main.classList.add('hatsu');
      if (base === 'z7') main.classList.add('chun');
      if (base === 'z5') {
        main.classList.add('haku');
        main.textContent = '';
      } else {
        main.textContent = map[base];
      }
      el.appendChild(main);
      return el;
    }
    
    const n = tileNumber(base);
    
    // 萬子
    if (suit === 'm') {
      const num = document.createElement('div');
      num.className = 'tile-mn-num';
      num.textContent = ['','一','二','三','四','五','六','七','八','九'][n];
      const lbl = document.createElement('div');
      lbl.className = 'tile-mn-lbl';
      lbl.textContent = '萬';
      el.appendChild(num);
      el.appendChild(lbl);
      return el;
    }
    
    // 筒子
    if (suit === 'p') {
      el.appendChild(this.makePinzu(n, isRed(tile)));
      return el;
    }
    
    // 索子
    if (suit === 's') {
      el.appendChild(this.makeSouzu(n));
      return el;

    el.textContent = tile;

  // 1筒：豪華な特別デザイン
  makePinzu1SVG() {
    // 16個の刻みの外輪
    let cogPath = '';
    const cogCount = 16;
    for (let i = 0; i < cogCount; i++) {
      const a1 = (i * 2 * Math.PI / cogCount) - Math.PI / 2;
      const a2 = ((i + 0.5) * 2 * Math.PI / cogCount) - Math.PI / 2;
      const a3 = ((i + 1) * 2 * Math.PI / cogCount) - Math.PI / 2;
      const r1 = 27, r2 = 29;
      const x1 = 30 + r1 * Math.cos(a1), y1 = 30 + r1 * Math.sin(a1);
      const x2 = 30 + r2 * Math.cos(a2), y2 = 30 + r2 * Math.sin(a2);
      const x3 = 30 + r1 * Math.cos(a3), y3 = 30 + r1 * Math.sin(a3);
      if (i === 0) cogPath += `M ${x1.toFixed(2)} ${y1.toFixed(2)} `;
      cogPath += `L ${x2.toFixed(2)} ${y2.toFixed(2)} L ${x3.toFixed(2)} ${y3.toFixed(2)} `;
    }
    cogPath += 'Z';
    
    return `<svg viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
      <!-- 外側の青いギア状の輪 -->
      <path d="${cogPath}" fill="#1a3a78"/>
      <!-- 内側の白い円 -->
      <circle cx="30" cy="30" r="22" fill="#fff8e1"/>
      <!-- 緑の中間リング -->
      <circle cx="30" cy="30" r="20" fill="#1a5d2c"/>
      <circle cx="30" cy="30" r="17" fill="#fff8e1"/>
      <!-- 8方向の金色の小ドット（装飾） -->
      <g fill="#d4a017">
        <circle cx="30" cy="14.5" r="1.5"/>
        <circle cx="41" cy="19" r="1.5"/>
        <circle cx="45.5" cy="30" r="1.5"/>
        <circle cx="41" cy="41" r="1.5"/>
        <circle cx="30" cy="45.5" r="1.5"/>
        <circle cx="19" cy="41" r="1.5"/>
        <circle cx="14.5" cy="30" r="1.5"/>
        <circle cx="19" cy="19" r="1.5"/>
      </g>
      <!-- 中央の赤い花弁（6枚） -->
      <g fill="#e60000">
        <circle cx="30" cy="22" r="3"/>
        <circle cx="37" cy="26" r="3"/>
        <circle cx="37" cy="34" r="3"/>
        <circle cx="30" cy="38" r="3"/>
        <circle cx="23" cy="34" r="3"/>
        <circle cx="23" cy="26" r="3"/>
      </g>
      <!-- 中央の白＋金小ドット -->
      <circle cx="30" cy="30" r="3" fill="#fff8e1"/>
      <circle cx="30" cy="30" r="1.5" fill="#d4a017"/>
    </svg>`;
  },
  
  // 筒子の各円の色（実物の麻雀牌準拠）
  getPinzuColors(n) {
    // 指示書準拠：青(C100M80Y20K20 → #1a3a78)・赤(C0M100Y100 → #e60000)
    const BLUE = '#1a3a78';

      1: [BLUE],  // 特別デザイン（実際は makePinzu1SVG で別処理）

      3: [BLUE, BLUE, BLUE],  // 3筒：斜め3個、全て青

      5: [BLUE, BLUE, RED, BLUE, BLUE],  // 5筒：四隅青、中央赤

  // 振り込んだ牌をハイライト表示（自分の河の最後の牌）
  showLoserDiscardHighlight(winningTile) {

    const rows = myKawaEl.querySelectorAll('.my-kawa-row');
    // 河の最後の牌を取得

      const tiles = row.querySelectorAll('.tile');
