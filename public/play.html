  showAgari(playerId, agariResult, isTsumo, loserId = null) {
    const s = game.state;
    const player = s.players.find(p => p.id === playerId);
    const winningTile = isTsumo
      ? (s.drawnTile || player.hand[player.hand.length - 1])
      : (agariResult.winningTile || s.lastDiscard.tile);
    const finalHand = isTsumo
      ? sortTiles(player.hand)
      : sortTiles([...player.hand, winningTile]);
    
    let bannerText = isTsumo ? 'ツモ' : 'ロン';
    if (agariResult.isHakuJoker) bannerText = '✨白ジョーカー✨';
    else if (player.feverActive) bannerText = 'FEVER!';
    if (player.isCpu) bannerText = `${player.name} ${bannerText}`;
    document.getElementById('agari-banner').textContent = bannerText;
    
    // アクション演出（カットイン）
    const splashType = agariResult.isHakuJoker ? 'tsumo' : (isTsumo ? 'tsumo' : 'ron');
    const splashText = agariResult.isHakuJoker ? '白ジョーカー！' : (isTsumo ? 'ツモ！' : 'ロン！');
    if (typeof showActionSplash === 'function') {
      showActionSplash(splashText, splashType, 1800);
    }
    
    // CPUがロンアガリした場合：振り込んだ牌を強調表示
    if (!isTsumo && player.isCpu && loserId === 'P0') {
      this.showLoserDiscardHighlight(winningTile);
    }
    
    // FEVER終了でバナーを消す
    if (typeof hideFeverBanner === 'function') hideFeverBanner();
    
    const handEl = document.getElementById('agari-hand');
    handEl.innerHTML = '';
    
    // ドラ判定用：手牌内のどの牌がドラかを判定する関数
    const doraTileBases = new Set();
    if (s.doraIndicators) {
      s.doraIndicators.forEach(ind => {
        doraTileBases.add(nextTile(ind));
      });
    }
    // 裏ドラ（リーチしてる時のみ表示用に集める）
    const uraDoraTileBases = new Set();
    if (player.isReached && s.uraDoraIndicators) {
      s.uraDoraIndicators.forEach(ind => {
        uraDoraTileBases.add(nextTile(ind));
      });
    }
    // 北はドラ
    const isKitaDora = (t) => tileBase(t) === 'z4';
    // 牌をドラ判定してハイライト追加するヘルパー
    const applyDoraHighlight = (tileEl, tile) => {
      const base = tileBase(tile);
      const isAka = (typeof isRed === 'function') && isRed(tile);
      const isOmote = doraTileBases.has(base);
      const isUra = uraDoraTileBases.has(base);
      const isKita = isKitaDora(tile);
      
      tileEl.style.position = 'relative';
      
      if (isAka) {
        tileEl.classList.add('aka-dora-highlight');
        const tag = document.createElement('span');
        tag.className = 'dora-label-tag aka';
        tag.textContent = '赤';
        tileEl.appendChild(tag);
      } else if (isKita) {
        tileEl.classList.add('kita-dora-highlight');
        const tag = document.createElement('span');
        tag.className = 'dora-label-tag kita';
        tag.textContent = '北';
        tileEl.appendChild(tag);
      } else if (isOmote) {
        tileEl.classList.add('dora-highlight');
        const tag = document.createElement('span');
        tag.className = 'dora-label-tag';
        tag.textContent = 'ドラ';
        tileEl.appendChild(tag);
      } else if (isUra) {
        tileEl.classList.add('ura-dora-highlight');
        const tag = document.createElement('span');
        tag.className = 'dora-label-tag ura';
        tag.textContent = '裏';
        tileEl.appendChild(tag);
      }
    };
    
    // 副露（鳴き牌）を先に表示
    if (player.melds.length > 0) {
      player.melds.forEach(meld => {
        meld.tiles.forEach(t => {
          const tileEl = this.makeTile(t, '');
          tileEl.style.cssText += 'width:34px; font-size:16px;';
          applyDoraHighlight(tileEl, t);
          handEl.appendChild(tileEl);
        });
        // 副露の区切り
        const sep = document.createElement('div');
        sep.style.cssText = 'width:1px; height:44px; background:rgba(255,255,255,0.2); margin:0 3px; align-self:center;';
        handEl.appendChild(sep);
      });
      const mainSep = document.createElement('div');
      mainSep.style.cssText = 'width:2px; height:52px; background:rgba(255,255,255,0.4); margin:0 4px; align-self:center;';
      handEl.appendChild(mainSep);
    }
    
    // 手牌（和了牌以外）を表示
    const handWithoutWinner = isTsumo 
      ? finalHand.slice(0, -1)   // ツモは最後の1枚が和了牌
      : finalHand.filter(t => tileBase(t) !== tileBase(winningTile) 
          ? true 
          : (finalHand.indexOf(t) < finalHand.lastIndexOf(t) || finalHand.filter(x => tileBase(x) === tileBase(t)).length === 1));
    // 安全策：ツモは単純に最後を和了牌として分離
    const displayHand = isTsumo ? finalHand.slice(0, -1) : finalHand;
    const displayWinner = winningTile;
    
    displayHand.forEach(t => {
      const tileEl = this.makeTile(t, '');
      if (!isTsumo && tileBase(t) === tileBase(displayWinner) && !handEl.querySelector('.winning-tile')) {
        // ロンの場合：最初の一致牌を和了牌として強調
        // セパレーター挿入
        const sep = document.createElement('div');
        sep.className = 'agari-winning-sep';
        handEl.appendChild(sep);
        tileEl.classList.add('winning-tile');
      }
      applyDoraHighlight(tileEl, t);
      handEl.appendChild(tileEl);
    });
    
    // ツモの場合：最後に区切り線＋和了牌
    if (isTsumo) {
      const sep = document.createElement('div');
      sep.className = 'agari-winning-sep';
      handEl.appendChild(sep);
      const winTileEl = this.makeTile(finalHand[finalHand.length - 1], '');
      winTileEl.classList.add('winning-tile');
      applyDoraHighlight(winTileEl, finalHand[finalHand.length - 1]);
      handEl.appendChild(winTileEl);
    }
    
    // 裏ドラ（リーチしてる場合のみ）
    // 翻数：表示牌の「次の牌」（通常ルール通り）
    // チップ：表示牌「そのもの」を手牌に持っていれば1枚ずつ
    let uraDoraHan = 0;   // 翻数用
    let uraDoraChip = 0;  // チップ用
    const allTilesForCheck = [...finalHand];
    player.melds.forEach(m => allTilesForCheck.push(...m.tiles));
    
    if (player.isReached && s.uraDoraIndicators) {
      for (const ind of s.uraDoraIndicators) {
        const uraBase = tileBase(ind);
        // 翻数：次の牌
        const uraTile = nextTile(ind);
        uraDoraHan += allTilesForCheck.filter(t => tileBase(t) === uraTile).length;
        // チップ：表示牌そのもの
        uraDoraChip += allTilesForCheck.filter(t => tileBase(t) === uraBase).length;
      }
    }
    
    const yakuEl = document.getElementById('agari-yaku');
    yakuEl.innerHTML = '';
    agariResult.yakuResult.yakuList.forEach(y => {
      const item = document.createElement('div');
      item.className = 'yaku-item';
      item.innerHTML = `<span>${y.name}</span><span class="han">${y.han}翻</span>`;
      yakuEl.appendChild(item);
    });
    
    // 裏ドラ翻数加算（次の牌）
    let totalHan = agariResult.yakuResult.totalHan;
    if (uraDoraHan > 0) {
      totalHan += uraDoraHan;
      const item = document.createElement('div');
      item.className = 'yaku-item';
      item.innerHTML = `<span style="color:var(--magenta)">裏ドラ${uraDoraHan}</span><span class="han">${uraDoraHan}翻</span>`;
      yakuEl.appendChild(item);
    }
    
    // 裏ドラ表示牌を出す
    if (player.isReached && s.uraDoraIndicators) {
      const uraDoraSec = document.createElement('div');
      uraDoraSec.style.cssText = 'display:flex; gap:4px; align-items:center; justify-content:center; margin-top:6px; padding:6px; background:rgba(255,0,170,0.1); border:1px solid var(--magenta); border-radius:4px;';
      const lbl = document.createElement('span');
      lbl.style.cssText = 'font-family: "DotGothic16",monospace; font-size:11px; color:var(--magenta);';
      lbl.textContent = '裏ドラ表示';
      uraDoraSec.appendChild(lbl);
      s.uraDoraIndicators.forEach(ind => {
        const t = this.makeTile(ind, 'dora-tile');
        uraDoraSec.appendChild(t);
      });
      yakuEl.appendChild(uraDoraSec);
    }
    
    const fu = 30;
    const isParent = playerId === s.dealerId;
    const isWareme = playerId === s.warePlayer;
    let points = calculateSimpleScore(totalHan, isParent, isTsumo);
    
    // 割れ目で2倍
    if (isWareme || loserId === s.warePlayer) {
      points *= 2;
    }
    
    document.getElementById('agari-hanfu').textContent = `${totalHan}翻 ${fu}符` + (isWareme || loserId === s.warePlayer ? ' (割れ目×2)' : '');
    document.getElementById('agari-points').textContent = points.toLocaleString();
    
    // 点数移動（増減を記録）
    const scoreDeltas = {};  // {playerId: 増減点数}
    s.players.forEach(p => scoreDeltas[p.id] = 0);
    
    if (isTsumo) {
      const others = s.players.filter(p => p.id !== playerId);
      const perOther = Math.ceil(points / others.length / 100) * 100;
      others.forEach(o => {
        o.score -= perOther;
        player.score += perOther;
        scoreDeltas[o.id] -= perOther;
        scoreDeltas[playerId] += perOther;
      });
    } else {
      const loser = s.players.find(p => p.id === loserId);
      loser.score -= points;
      player.score += points;
      scoreDeltas[loserId] -= points;
      scoreDeltas[playerId] += points;
    }
    // リーチ棒回収
    if (s.reachSticks > 0) {
      player.score += s.reachSticks * 1000;
      scoreDeltas[playerId] += s.reachSticks * 1000;
      s.reachSticks = 0;
    }
    
    // トビ判定（フラグだけ立てる、画面はアガリ画面の後）
    let tobiPlayer = null;
    for (const p of s.players) {
      if (p.score < 0 && !s.players.some(pl => pl.feverActive)) {
        tobiPlayer = p;
        break;
      }
    }
    this._pendingTobi = tobiPlayer;
    
    // ===== チップ計算 =====
    // チップは2種類に分かれる：
    // - 役満ご祝儀チップ（yakumanChip）：ツモ/ロン問わず全員から
    // - 通常チップ（normalChip）：ツモ=全員、ロン=振り込み者のみ
    let yakumanChip = 0;  // 全員から取るチップ
    let normalChip = 0;   // ツモなら全員、ロンなら振り込み者のみ
    const chipDetails = [];
    
    // 一発判定（先に判定しておく）
    const ipatsuYaku = agariResult.yakuResult.yakuList.find(y => y.name === '一発');
    const hasIpatsu = !!ipatsuYaku;
    
    // 役満チップ（ご祝儀：全員から、一発倍率の対象外）
    if (agariResult.yakuResult.isYakuman) {
      const ykCount = agariResult.yakuResult.yakumanCount || 1;
      const yChip = ykCount === 1 ? 10 : ykCount === 2 ? 20 : 30;
      yakumanChip += yChip;
      chipDetails.push(`役満ご祝儀: +${yChip}（全員から）`);
    } else if (totalHan >= 13) {
      yakumanChip += 5;
      chipDetails.push(`数え役満ご祝儀: +5（全員から）`);
    }
    
    // 裏ドラチップ：表示牌そのものを手牌に持っていれば1枚ずつ（通常チップ扱い）
    if (uraDoraChip > 0) {
      normalChip += uraDoraChip;
      chipDetails.push(`裏ドラ表示牌${uraDoraChip}枚: +${uraDoraChip}`);
    }
    
    // 一索/一萬/九萬チップ（面前で手中に七筒1枚以上で発動、一発で2倍、通常チップ扱い）
    const isMenzen = !player.melds || player.melds.every(m => m.type === 'ankan');
    const p7CountForChip = allTilesForCheck.filter(t => tileBase(t) === 'p7').length;
    
    if (isMenzen && p7CountForChip > 0) {
      const targetBases = ['s1', 'm1', 'm9'];
      let targetCount = 0;
      const found = [];
      targetBases.forEach(base => {
        const c = allTilesForCheck.filter(t => tileBase(t) === base).length;
        if (c > 0) {
          targetCount += c;
          found.push(`${base === 's1' ? '①索' : base === 'm1' ? '一萬' : '九萬'}×${c}`);
        }
      });
      if (targetCount > 0) {
        const baseChip = targetCount * 2;
        const chip = hasIpatsu ? baseChip * 2 : baseChip;
        normalChip += chip;
        if (hasIpatsu) {
          chipDetails.push(`七筒×${p7CountForChip}あり・${found.join('・')}: +${baseChip}×一発倍率2 = +${chip}`);
        } else {
          chipDetails.push(`七筒×${p7CountForChip}あり・${found.join('・')}: +${chip}`);
        }
      }
    }
    
    // チップ移動
    const chipDeltas = {};
    s.players.forEach(p => chipDeltas[p.id] = 0);
    
    // 役満ご祝儀：全員から取る（ツモ/ロン問わず）
    if (yakumanChip > 0) {
      const others = s.players.filter(p => p.id !== playerId);
      others.forEach(o => {
        o.chips -= yakumanChip;
        player.chips += yakumanChip;
        chipDeltas[o.id] -= yakumanChip;
        chipDeltas[playerId] += yakumanChip;
      });
    }
    
    // 通常チップ：ツモなら全員、ロンなら振り込み者のみ
    if (normalChip > 0) {
      if (isTsumo) {
        const others = s.players.filter(p => p.id !== playerId);
        others.forEach(o => {
          o.chips -= normalChip;
          player.chips += normalChip;
          chipDeltas[o.id] -= normalChip;
          chipDeltas[playerId] += normalChip;
        });
      } else {
        // ロン：振り込み者のみが払う
        const loser = s.players.find(p => p.id === loserId);
        if (loser) {
          loser.chips -= normalChip;
          player.chips += normalChip;
          chipDeltas[loserId] -= normalChip;
          chipDeltas[playerId] += normalChip;
        }
      }
    }
    
    // 表示用合計（旧chipGainの代わり）
    const chipGain = yakumanChip + normalChip;
    
    // ===== 結果表示 =====
    // チップ詳細セクション（チップ獲得あり時のみ表示）
    if (chipDetails.length > 0 && chipGain > 0) {
      const chipSec = document.createElement('div');
      chipSec.style.cssText = 'margin-top:8px; padding:6px 10px; background:rgba(0,229,255,0.1); border:1px solid var(--cyan-pop); border-radius:4px;';
      const title = document.createElement('div');
      title.style.cssText = 'font-family:"DotGothic16",monospace; font-size:11px; color:var(--cyan-pop); margin-bottom:3px;';
      // 通常チップと役満チップの内訳
      const totalGain = (isTsumo ? normalChip * 2 : normalChip) + yakumanChip * 2;
      if (isTsumo) {
        title.textContent = `★チップ獲得: 合計+${totalGain}枚（全員から）`;
      } else {
        // ロン時
        const fromLoser = normalChip;
        const fromAll = yakumanChip * 2;
        if (yakumanChip > 0 && normalChip > 0) {
          title.textContent = `★チップ獲得: 振込者から+${fromLoser} / 全員から+${yakumanChip}×2 = 合計+${totalGain}`;
        } else if (yakumanChip > 0) {
          title.textContent = `★役満ご祝儀: 全員から+${yakumanChip} = 合計+${fromAll}`;
        } else {
          title.textContent = `★チップ獲得: 振込者(${s.players.find(p=>p.id===loserId).name})から+${fromLoser}`;
        }
      }
      chipSec.appendChild(title);
      chipDetails.forEach(d => {
        const det = document.createElement('div');
        det.style.cssText = 'font-family:"DotGothic16",monospace; font-size:10px; color:rgba(255,255,255,0.8);';
        det.textContent = '  ' + d;
        chipSec.appendChild(det);
      });
      yakuEl.appendChild(chipSec);
    }
    
    // 点数移動の詳細（増減を色分けして表示）
    const scoreSec = document.createElement('div');
    scoreSec.style.cssText = 'margin-top:8px; padding:8px 10px; background:rgba(255,215,0,0.1); border:1px solid var(--gold-dim); border-radius:4px;';
    const sTitle = document.createElement('div');
    sTitle.style.cssText = 'font-family:"DotGothic16",monospace; font-size:11px; color:var(--gold); margin-bottom:6px; text-align:center;';
    sTitle.textContent = '◆ 点数・チップ移動 ◆';
    scoreSec.appendChild(sTitle);
    
    s.players.forEach(p => {
      const row = document.createElement('div');
      row.id = `agari-row-${p.id}`;
      row.style.cssText = 'font-family:"DotGothic16",monospace; font-size:13px; display:flex; justify-content:space-between; align-items:center; padding:6px 8px; margin:3px 0; border-radius:4px;';
      
      const scoreDelta = scoreDeltas[p.id] || 0;
      const chipDelta = chipDeltas[p.id] || 0;
      const isWinner = p.id === playerId;
      
      // 背景色：勝者は金、敗者は赤
      if (isWinner) {
        row.style.background = 'rgba(255,215,0,0.2)';
        row.style.borderLeft = '3px solid var(--gold)';
      } else if (scoreDelta < 0 || chipDelta < 0) {
        row.style.background = 'rgba(255,45,85,0.15)';
        row.style.borderLeft = '3px solid var(--red)';
      }
      
      // プレイヤー名
      const nameDiv = document.createElement('span');
      nameDiv.style.cssText = 'flex:1; color:white;';
      nameDiv.textContent = (isWinner ? '👑 ' : '') + p.name;
      row.appendChild(nameDiv);
      
      // 点数（増減を強調表示）
      const scoreDiv = document.createElement('span');
      scoreDiv.style.cssText = 'min-width:130px; text-align:right; color:white;';
      const scoreDeltaStr = scoreDelta > 0 
        ? `<span style="color:#ffd700; font-weight:bold;"> ＋${scoreDelta.toLocaleString()}</span>`
        : scoreDelta < 0 
          ? `<span style="color:#ff4d4d; font-weight:bold;"> ${scoreDelta.toLocaleString()}</span>`
          : '';
      scoreDiv.innerHTML = `${p.score.toLocaleString()}点${scoreDeltaStr}`;
      row.appendChild(scoreDiv);
      
      // チップ
      if (chipGain > 0) {
        const chipDiv = document.createElement('span');
        chipDiv.style.cssText = 'min-width:75px; text-align:right; margin-left:6px; display:inline-flex; align-items:center; gap:4px; justify-content:flex-end;';
        const playerIdx = s.players.findIndex(pl => pl.id === p.id);
        const chipNumSpan = document.createElement('span');
        const chipDeltaStr = chipDelta > 0
          ? `<span style="color:#00e5ff; font-weight:bold;"> ＋${chipDelta}</span>`
          : chipDelta < 0
            ? `<span style="color:#ff4d4d; font-weight:bold;"> ${chipDelta}</span>`
            : '';
        chipNumSpan.innerHTML = `${p.chips}${chipDeltaStr}`;
        chipDiv.appendChild(chipNumSpan);
        if (typeof makeChipStack === 'function') {
          chipDiv.appendChild(makeChipStack(p.chips, playerIdx));
        }
        row.appendChild(chipDiv);
      }
      
      scoreSec.appendChild(row);
    });
    yakuEl.appendChild(scoreSec);
    
    // 次局のために情報を保存
    this.lastResult = {
      wasAgari: true,
      agariPlayerId: playerId,
      wasDealer: playerId === s.dealerId,
    };
    
    // カットイン演出をしっかり見せてからアガリ画面表示
    setTimeout(() => {
      document.getElementById('agari-screen').classList.add('show');
      
      // チップ移動アニメーション（チップ獲得あり時のみ）
      if (typeof animateChipTransfer === 'function' && chipGain > 0) {
        setTimeout(() => {
          const winnerRow = document.getElementById(`agari-row-${playerId}`);
          if (!winnerRow) return;
          // 敗者ごとにチップを飛ばす
          s.players.forEach(p => {
            if (p.id === playerId) return;
            const chipDelta = chipDeltas[p.id] || 0;
            if (chipDelta < 0) {
              const loserRow = document.getElementById(`agari-row-${p.id}`);
              if (loserRow) {
                const playerIdx = s.players.findIndex(pl => pl.id === p.id);
                animateChipTransfer(loserRow, winnerRow, -chipDelta, playerIdx);
              }
            }
          });
        }, 500);
      }
    }, 1600);
  },
  
  // トビチェック：0以下になったらゲーム終了（FEVER中は続行）
  checkTobi(s) {
    for (const p of s.players) {
      if (p.score < 0) {
        // FEVER中は続行
        if (s.players.some(pl => pl.feverActive)) return false;
        const tobiEl = document.getElementById('tobi-overlay');
        const nameEl = document.getElementById('tobi-name');
        nameEl.textContent = `${p.name} が点数マイナスでトビ！`;
        tobiEl.classList.add('show');
        if (typeof hideFeverBanner === 'function') hideFeverBanner();
        document.getElementById('tobi-btn').onclick = () => {
          tobiEl.classList.remove('show');
          this.showFinalResult();
        };
        return true;  // トビ発生
      }
    }
    return false;  // トビなし
  },

  showRyukyoku() {
    const s = game.state;
    
    // 各プレイヤーのテンパイ判定
    const tenpaiStatus = s.players.map(p => {
      // リーチ者は当然テンパイ
      if (p.isReached) return { player: p, isTenpai: true };
      // 副露でなく手牌13枚で判定
      const isTenpaiState = isTenpai(p.hand, p.melds);
      return { player: p, isTenpai: isTenpaiState };
    });
    
    const tenpaiPlayers = tenpaiStatus.filter(t => t.isTenpai);
    const notenPlayers = tenpaiStatus.filter(t => !t.isTenpai);
    
    // 罰符：合計3000点をノーテン者が負担、テンパイ者で山分け
    if (tenpaiPlayers.length > 0 && notenPlayers.length > 0) {
      const totalPenalty = 3000;
      const perNoten = Math.ceil(totalPenalty / notenPlayers.length / 100) * 100;
      const perTenpai = Math.floor(totalPenalty / tenpaiPlayers.length / 100) * 100;
      notenPlayers.forEach(t => t.player.score -= perNoten);
      tenpaiPlayers.forEach(t => t.player.score += perTenpai);
    }
    
    // トビ判定（フラグだけ立てる）
    let tobiPlayer = null;
    for (const p of s.players) {
      if (p.score < 0 && !s.players.some(pl => pl.feverActive)) {
        tobiPlayer = p;
        break;
      }
    }
    this._pendingTobi = tobiPlayer;
    
    document.getElementById('agari-banner').textContent = '流局';
    
    // テンパイ者の手牌と待ち牌を表示
    const handEl = document.getElementById('agari-hand');
    handEl.innerHTML = '';
    
    const tenpaiSec = document.createElement('div');
    tenpaiSec.style.cssText = 'display:flex; flex-direction:column; gap:8px; width:100%;';
    
    tenpaiStatus.forEach(t => {
      const p = t.player;
      const row = document.createElement('div');
      row.style.cssText = 'padding:6px; background:rgba(0,0,0,0.4); border-radius:4px; border:1px solid ' + (t.isTenpai ? 'var(--cyan-pop)' : 'rgba(255,140,0,0.5)') + ';';
      
      // プレイヤー名と状態
      const head = document.createElement('div');
      head.style.cssText = 'display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;';
      const nameSpan = document.createElement('span');
      nameSpan.style.cssText = 'font-family:"DotGothic16",monospace; font-size:12px; color:white;';
      nameSpan.textContent = p.name;
      head.appendChild(nameSpan);
      const statusSpan = document.createElement('span');
      statusSpan.style.cssText = 'font-family:"DotGothic16",monospace; font-size:11px; font-weight:bold; color:' + (t.isTenpai ? 'var(--cyan-pop)' : '#ff8c00') + ';';
      statusSpan.textContent = t.isTenpai ? (p.isReached ? 'リーチ・テンパイ' : 'テンパイ') : 'ノーテン';
      head.appendChild(statusSpan);
      row.appendChild(head);
      
      // テンパイなら手牌＋待ち牌を表示
      if (t.isTenpai) {
        // 手牌（小さめサイズ）
        const handDiv = document.createElement('div');
        handDiv.style.cssText = 'display:flex; gap:1px; flex-wrap:wrap; align-items:center; margin-bottom:3px;';
        
        // 副露を先に
        p.melds.forEach(meld => {
          meld.tiles.forEach(tile => {
            const tileEl = this.makeTile(tile, '');
            tileEl.style.cssText += 'width:22px; height:30px; font-size:11px;';
            handDiv.appendChild(tileEl);
          });
          const sep = document.createElement('div');
          sep.style.cssText = 'width:1px; height:28px; background:rgba(255,255,255,0.2); margin:0 2px;';
          handDiv.appendChild(sep);
        });
        
        // 手牌
        const sortedHand = sortTiles([...p.hand]);
        sortedHand.forEach(tile => {
          const tileEl = this.makeTile(tile, '');
          tileEl.style.cssText += 'width:22px; height:30px; font-size:11px;';
          handDiv.appendChild(tileEl);
        });
        row.appendChild(handDiv);
        
        // 待ち牌
        const waits = getWaitingTiles(p.hand, p.melds);
        if (waits.length > 0) {
          const waitDiv = document.createElement('div');
          waitDiv.style.cssText = 'display:flex; gap:3px; align-items:center; margin-top:4px;';
          const lbl = document.createElement('span');
          lbl.style.cssText = 'font-family:"DotGothic16",monospace; font-size:10px; color:var(--cyan-pop);';
          lbl.textContent = '待ち:';
          waitDiv.appendChild(lbl);
          waits.forEach(w => {
            const wEl = this.makeTile(w, '');
            wEl.style.cssText += 'width:20px; height:28px; font-size:10px; border-color:var(--cyan-pop); box-shadow:0 0 6px rgba(0,229,255,0.6);';
            waitDiv.appendChild(wEl);
          });
          // 残り枚数も表示
          const usedTiles = [];
          s.players.forEach(pl => {
            usedTiles.push(...pl.hand);
            pl.melds.forEach(m => usedTiles.push(...m.tiles));
            pl.discards.forEach(d => usedTiles.push(d.tile));
            pl.kitaPulls.forEach(k => usedTiles.push(k.tile));
          });
          s.doraIndicators.forEach(d => usedTiles.push(d));
          if (s.uraDoraIndicators) s.uraDoraIndicators.forEach(d => usedTiles.push(d));
          
          let remaining = 0;
          waits.forEach(w => {
            const count = 4 - usedTiles.filter(t => tileBase(t) === w).length;
            remaining += Math.max(0, count);
          });
          const remSpan = document.createElement('span');
          remSpan.style.cssText = 'font-family:"DotGothic16",monospace; font-size:10px; color:var(--gold); margin-left:6px;';
          remSpan.textContent = `(残${remaining}枚)`;
          waitDiv.appendChild(remSpan);
          
          row.appendChild(waitDiv);
        }
      }
      
      tenpaiSec.appendChild(row);
    });
    
    handEl.appendChild(tenpaiSec);
    
    const yakuEl = document.getElementById('agari-yaku');
    yakuEl.innerHTML = '';
    
    // 罰符の表示
    if (tenpaiPlayers.length > 0 && notenPlayers.length > 0) {
      const totalPenalty = 3000;
      const perNoten = Math.ceil(totalPenalty / notenPlayers.length / 100) * 100;
      const perTenpai = Math.floor(totalPenalty / tenpaiPlayers.length / 100) * 100;
      const note = document.createElement('div');
      note.style.cssText = 'font-family: "DotGothic16", monospace; font-size: 12px; color: var(--gold); text-align: center; padding:8px; background:rgba(255,215,0,0.1); border:1px solid var(--gold-dim); border-radius:4px;';
      note.innerHTML = `ノーテン罰符<br>テンパイ者：<strong style="color:var(--cyan-pop)">+${perTenpai}点</strong> / ノーテン者：<strong style="color:#ff4d4d">-${perNoten}点</strong>`;
      yakuEl.appendChild(note);
    } else {
      const note = document.createElement('div');
      note.style.cssText = 'font-family: "DotGothic16", monospace; font-size: 11px; color: rgba(255,255,255,0.6); text-align: center; padding:6px;';
      note.textContent = tenpaiPlayers.length === 0 ? '全員ノーテン（罰符なし）' : '全員テンパイ（罰符なし）';
      yakuEl.appendChild(note);
    }
    
    document.getElementById('agari-hanfu').textContent = '';
    document.getElementById('agari-points').textContent = '';
    
    this.lastResult = {
      wasAgari: false,
      agariPlayerId: null,
      wasDealer: false,
    };
    
    document.getElementById('agari-screen').classList.add('show');
  },
  
  // ===== ターン進行（asyncなし、setTimeoutでつなぐ） =====
  proceedTurn() {
    try {
      const s = game.state;
      
      if (s.wall.length === 0) {
        this.showRyukyoku();
        return;
      }
      
      const playerId = s.currentTurn;
      const player = s.players.find(p => p.id === playerId);
      
      // ツモ
      const { drawn } = game.drawTile(playerId);
      if (!drawn) {
        this.showRyukyoku();
        return;
      }
      s.drawnTile = drawn;
      s.phase = 'wait_discard';
      
      // 中・發ボーナス：リーチ一発中にツモった場合、他家から各1枚ずつチップを取る
      // 白はジョーカー（強制アガリ）で別処理
      const tsumoBase = tileBase(drawn);
      if ((tsumoBase === 'z6' || tsumoBase === 'z7') && player.isReached && player.ipatsuActive) {
        this.applyChunHatsuBonus(player, tsumoBase);
      }
      
      if (!player.isCpu) {
        this.render();
        this.setupMyTurnButtons(drawn);
        return;
      }
      
      // CPU処理
      this.render();
      setTimeout(() => this.cpuDoAction(playerId, drawn), 700);
    } catch (err) {
      console.error('proceedTurn error:', err);
      this.showToast('エラー: ' + err.message);
    }
  },
  
  // 中・發を一発ツモした際のチップボーナス（他家から各1枚ずつ取る）
  applyChunHatsuBonus(player, tsumoBase) {
    try {
      const tileName = tsumoBase === 'z6' ? '發' : '中';
      const s = game.state;
      const others = s.players.filter(p => p.id !== player.id);
      others.forEach(o => {
        o.chips -= 1;
        player.chips += 1;
      });
      // 通知
      this.showToast(`✨${player.name}が${tileName}を一発ツモ！チップ+${others.length}枚`, 2500);
      // 演出（小さなフラッシュ）
      if (typeof showActionSplash === 'function') {
        showActionSplash(`${tileName}ボーナス！`, 'pon', 1200);
      }
      this.render();
      
      // チップ移動アニメーション
      if (typeof animateChipTransfer === 'function') {
        setTimeout(() => {
          // 勝者の表示位置を特定
          const winnerEl = this.getPlayerScoreEl(player.id);
          if (!winnerEl) return;
          others.forEach((o, idx) => {
            const loserEl = this.getPlayerScoreEl(o.id);
            if (loserEl) {
              const playerIdx = s.players.findIndex(pl => pl.id === o.id);
              // 1枚だけ飛ばす（実際の動き）
              setTimeout(() => {
                animateChipTransfer(loserEl, winnerEl, 1, playerIdx);
              }, idx * 200);
            }
          });
        }, 300);
      }
    } catch (err) {
      console.error('applyChunHatsuBonus error:', err);
    }
  },
  
  // プレイヤーの点数表示エリア要素を取得（チップ移動の起点/終点用）
  getPlayerScoreEl(playerId) {
    if (playerId === 'P0') {
      // 自分の場合
      return document.getElementById('my-chips') || document.querySelector('.my-info');
    }
    // CPU
    const idx = playerId === 'P1' ? 1 : 2;
    return document.getElementById(`opp${idx}-chips`) || document.getElementById(`opp${idx}`);
  },
  
  cpuDoAction(playerId, drawn) {
    try {
      const s = game.state;
      const player = s.players.find(p => p.id === playerId);
      
      // 他家がFEVER中かつ自分が未リーチ → 制限モード
      const otherFeverRestricted = s.players.some(p => p.id !== playerId && p.feverActive) && !player.isReached;
      
      if (otherFeverRestricted) {
        // 北抜き強制（あれば即抜く）
        if (game.hasKita(playerId)) {
          game.doKitaPull(playerId);
          this.showToast(`${player.name}：北抜き（強制）`);
          if (typeof showActionSplash === 'function') showActionSplash('北！', 'kita', 700);
          this.render();
          const newDrawn = player.hand[player.hand.length - 1];
          s.drawnTile = newDrawn;
          setTimeout(() => this.cpuDoAction(playerId, newDrawn), 500);
          return;
        }
        // ツモアガリ不可・カン不可 → 強制ツモ切り
        const t = player.hand[player.hand.length - 1];
        game.discardTile(playerId, t, true);
        this.render();
        setTimeout(() => this.handleAfterDiscard(playerId, t), 300);
        return;
      }
      
      // ツモアガリ判定
      const agari = game.checkAgariTsumo(playerId, drawn);
      if (agari) {
        this.showAgari(playerId, agari, true);
        return;
      }
      
      // 北抜き：手牌に北があれば抜く（北は河に捨てられないため）
      // リーチ後は「ツモ牌が北 かつ 待ち牌に北が含まれない」場合のみ可能
      if (game.hasKita(playerId)) {
        let canPullKita = true;
        if (player.isReached) {
          const tsumoTile = player.hand[player.hand.length - 1];
          if (tsumoTile !== 'z4') {
            canPullKita = false;
          } else {
            const handWithoutTsumo = player.hand.slice(0, -1);
            const waits = getWaitingTiles(handWithoutTsumo, player.melds);
            if (waits.includes('z4')) {
              canPullKita = false;
            }
          }
        }
        
        if (canPullKita) {
          game.doKitaPull(playerId);
          this.showToast(`${player.name}:北抜き`);
          if (typeof showActionSplash === 'function') showActionSplash('北！', 'kita', 700);
          this.render();
          
          // 北抜きに対する他家のポン/カン応答チェック
          if (this.checkKitaClaimResponse(playerId)) {
            return;  // 応答処理が始まったらここで止める
          }
          
          const newDrawn = player.hand[player.hand.length - 1];
          s.drawnTile = newDrawn;
          if (player.isReached) {
            // リーチ中はツモアガリチェック後、強制ツモ切り
            const ra = game.checkAgariTsumo(playerId, newDrawn);
            if (ra) {
              setTimeout(() => this.showAgari(playerId, ra, true), 500);
              return;
            }
            setTimeout(() => {
              game.discardTile(playerId, newDrawn, true);
              this.render();
              setTimeout(() => this.handleAfterDiscard(playerId, newDrawn), 300);
            }, 500);
            return;
          }
          setTimeout(() => this.cpuDoAction(playerId, newDrawn), 500);
          return;
        }
      }
      
      // 暗カン（40%でランダム）
      const ankanCandidates = game.getAnkanCandidates(playerId);
      if (ankanCandidates.length > 0 && Math.random() < 0.4) {
        const tile = ankanCandidates[0];
        game.doAnkan(playerId, tile);
        this.showToast(`${player.name}：暗カン`);
        this.render();
        const rinshan = game.drawRinshan(playerId);
        if (rinshan) {
          s.drawnTile = rinshan;
          const rinshanAgari = game.checkAgariTsumo(playerId, rinshan);
          if (rinshanAgari) {
            setTimeout(() => this.showAgari(playerId, rinshanAgari, true), 500);
            return;
          }
          setTimeout(() => this.cpuDoAction(playerId, rinshan), 500);
          return;
        }
      }
      
      // リーチ判定（他家がFEVER中は不可）
      const otherFeverForCpu = s.players.some(p => p.id !== playerId && p.feverActive);
      if (!player.isReached && !otherFeverForCpu) {
        const reachOpt = game.cpuCheckReach(player);
        if (reachOpt && Math.random() < 0.7) {
          // フリテンリーチかどうかでメッセージ変更
          const reachType = reachOpt.isFuriten ? 'furiten' : 'normal';
          this.showToast(`${player.name}：${reachOpt.isFuriten ? 'フリテン' : ''}リーチ！`);
          if (typeof showActionSplash === 'function') showActionSplash('リーチ！', 'reach');
          // 打牌予定の牌を取得（FEVER判定で除外するため）
          const reachDiscardTile = player.hand[reachOpt.discardIdx];
          const { trigger } = game.declareReach(playerId, reachType, reachDiscardTile);
          this.render();
          if (trigger) {
            this.showFeverEffect(trigger);
            setTimeout(() => {
              this.cpuDoReachDiscard(playerId, reachOpt);
            }, 2500);
          } else {
            setTimeout(() => {
              this.cpuDoReachDiscard(playerId, reachOpt);
            }, 600);
          }
          return;
        }
      }
      
      // 通常打牌
      const tile = game.cpuChooseDiscard(player);
      const isTsumogiri = (tile === drawn);
      game.discardTile(playerId, tile, isTsumogiri);
      this.render();
      
      setTimeout(() => this.handleAfterDiscard(playerId, tile), 300);
    } catch (err) {
      console.error('cpuDoAction error:', err);
      this.showToast('エラー: ' + err.message);
    }
  },
  
  cpuDoReachDiscard(playerId, reachOpt) {
    try {
      const player = game.state.players.find(p => p.id === playerId);
      const reachTile = player.hand[reachOpt.discardIdx];
      game.discardTile(playerId, reachTile, false);
      this.render();
      setTimeout(() => this.handleAfterDiscard(playerId, reachTile), 500);
    } catch (err) {
      console.error('cpuDoReachDiscard error:', err);
    }
  },
  
  // 打牌後：ロン・ポン・カン応答チェック
  handleAfterDiscard(fromPlayerId, tile) {
    try {
      const s = game.state;
      
      // 1. ロン候補チェック
      const ronClaimers = [];
      for (const p of s.players) {
        if (p.id === fromPlayerId) continue;
        const r = game.checkAgariRon(p.id, tile, fromPlayerId);
        if (r && r.canRon) {
          ronClaimers.push({ player: p, result: r });
        }
      }
      
      if (ronClaimers.length > 0) {
        const myRon = ronClaimers.find(c => c.player.id === 'P0');
        if (myRon) {
          this.showRonOption(myRon.result, fromPlayerId, tile);
          return;
        }
        // CPUのロン
        const cpuRon = ronClaimers[0];
        cpuRon.result.winningTile = tile;
        this.showAgari(cpuRon.player.id, cpuRon.result, false, fromPlayerId);
        return;
      }
      
      // 2. ポン・カン応答チェック
      let claimResolved = false;
      for (const p of s.players) {
        if (claimResolved) break;
        if (p.id === fromPlayerId) continue;
        
        if (game.canMinkan(p.id, tile)) {
          if (p.isCpu) {
            if (Math.random() < 0.4) {
              this.cpuDoMinkan(p.id, tile, fromPlayerId);
              claimResolved = true;
              break;
            }
          } else {
            this.showMinkanOption(tile, fromPlayerId);
            return;
          }
        }
        
        if (game.canPon(p.id, tile)) {
          if (p.isCpu) {
            if (Math.random() < 0.25) {
              this.cpuDoPon(p.id, tile, fromPlayerId);
              claimResolved = true;
              break;
            }
          } else {
            this.showPonOption(tile, fromPlayerId);
            return;
          }
        }
      }
      
      if (claimResolved) return;
      
      // 通常打牌では一発消滅しない（鳴き・カンのみで消える）
      // 北抜きでも自分の一発は doKitaPull 内で消滅、他家の一発は影響なし
      game.nextTurn();
      setTimeout(() => this.proceedTurn(), 100);
    } catch (err) {
      console.error('handleAfterDiscard error:', err);
      this.showToast('エラー: ' + err.message);
    }
  },
  
  cpuDoPon(playerId, tile, fromPlayerId) {
    const player = game.state.players.find(p => p.id === playerId);
    game.doPon(playerId, tile, fromPlayerId);
    this.showToast(`${player.name}：ポン！`);
    if (typeof showActionSplash === 'function') showActionSplash('ポン！', 'pon');
    this.render();
    
    setTimeout(() => {
      // ポン直後の打牌
      const t = game.cpuChooseDiscard(player);
      game.discardTile(playerId, t, false);
      this.render();
      setTimeout(() => this.handleAfterDiscard(playerId, t), 300);
    }, 600);
  },
  
  cpuDoMinkan(playerId, tile, fromPlayerId) {
    const player = game.state.players.find(p => p.id === playerId);
    game.doMinkan(playerId, tile, fromPlayerId);
    this.showToast(`${player.name}：カン！`);
    if (typeof showActionSplash === 'function') showActionSplash('カン！', 'kan');
    this.render();
    
    setTimeout(() => {
      const rinshan = game.drawRinshan(playerId);
      if (rinshan) {
        const ra = game.checkAgariTsumo(playerId, rinshan);
        if (ra) {
          this.showAgari(playerId, ra, true);
          return;
        }
        // 嶺上ツモ後、CPUの通常アクション
        this.cpuDoAction(playerId, rinshan);
        return;
      }
      // 嶺上引けない（カン4回目）：強制ツモなし打牌
      const t = game.cpuChooseDiscard(player);
      game.discardTile(playerId, t, false);
      this.render();
      setTimeout(() => this.handleAfterDiscard(playerId, t), 300);
    }, 500);
  },
  
  // ===== 自分のターンのボタンセットアップ =====
  setupMyTurnButtons(drawn) {
    const me = game.state.players[0];
    const bar = document.getElementById('action-bar');
    bar.innerHTML = '';
    const s = game.state;
    
    // 他家がFEVER中かつ自分が未リーチ → 行動制限
    const otherFever = s.players.some(p => p.id !== 'P0' && p.feverActive);
    const restricted = otherFever && !me.isReached;
    
    // ツモアガリチェック（常に可能）
    const agari = game.checkAgariTsumo('P0', drawn);
    if (agari) {
      const btn = this.makeActionBtn('ツモ', 'tsumo');
      btn.onclick = () => {
        bar.innerHTML = '';
        this.showAgari('P0', agari, true);
      };
      bar.appendChild(btn);
    }
    
    if (restricted) {
      // FEVER制限中：ツモアガリ不可・北抜き強制・カン不可・強制ツモ切り
      
      // 北が手牌にある場合は強制北抜き（選択肢なし、即実行）
      if (game.hasKita('P0')) {
        game.doKitaPull('P0');
        this.showToast('北抜き（強制）');
        if (typeof showActionSplash === 'function') showActionSplash('北！', 'kita', 700);
        this.render();
        const newDrawn = me.hand[me.hand.length - 1];
        s.drawnTile = newDrawn;
        // 北抜き後も同じ制限で再呼び出し
        this.setupMyTurnButtons(newDrawn);
        return;
      }
      
      // ツモ切りのみ（3秒で自動実行）
      const tsumogiriBtn = this.makeActionBtn('ツモ切り (3)', 'skip');
      tsumogiriBtn.onclick = () => {
        clearTimeout(this._feverAutoDiscard);
        clearInterval(this._feverCountdown);
        const idx = me.hand.length - 1;
        this.handleDiscard(idx, drawn);
      };
      bar.appendChild(tsumogiriBtn);
      
      // カウントダウン表示
      let count = 3;
      this._feverCountdown = setInterval(() => {
        count--;
        if (count > 0) {
          tsumogiriBtn.textContent = `ツモ切り (${count})`;
        } else {
          clearInterval(this._feverCountdown);
        }
      }, 1000);
      
      // 3秒で自動ツモ切り
      this._feverAutoDiscard = setTimeout(() => {
        clearInterval(this._feverCountdown);
        if (game.state.currentTurn === 'P0' && game.state.phase === 'wait_discard') {
          const idx = me.hand.length - 1;
          this.handleDiscard(idx, drawn);
        }
      }, 3000);
      
      this.showToast('FEVER中：3秒で強制ツモ切り', 2500);
      
      // 手牌はツモ牌のみタップ可能
      this.renderMyHandFeverRestricted(drawn);
      return;
    }
    
    // 通常時
    // リーチ系（FEVERが可能なら専用ボタン、なければ通常リーチ・フリテンリーチ）
    if (!me.isReached) {
      const feverOpt = game.checkFeverOption('P0');
      if (feverOpt) {
        const labels = {
          'p7': '🎰FEVERリーチ⑦',
          'm7': '🎰FEVERリーチ⑦',
          'double': '🎰★Wフィーバー★',
        };
        const btn = this.makeActionBtn(labels[feverOpt.trigger] || '🎰FEVER', 'fever');
        btn.onclick = () => this.declareMyFever(feverOpt);
        bar.appendChild(btn);
      } else {
        const reachOpt = game.cpuCheckReach(me);
        if (reachOpt) {
          if (reachOpt.isFuriten) {
            const btn = this.makeActionBtn('フリテン立直', 'reach-furiten');
            btn.onclick = () => this.declareMyReach(true);
            bar.appendChild(btn);
          } else {
            const btn = this.makeActionBtn('リーチ', 'reach');
            btn.onclick = () => this.declareMyReach(false);
            bar.appendChild(btn);
          }
        }
      }
      
      // ツモ切りボタン（常に表示）
      const tsumogiriBtn = this.makeActionBtn('ツモ切り', 'skip');
      tsumogiriBtn.onclick = () => {
        const idx = me.hand.length - 1;
        this.handleDiscard(idx, drawn);
      };
      bar.appendChild(tsumogiriBtn);
    }
    
    // 暗カン（リーチ後は待ち変化なしのもののみ候補に含まれる）
    const ankanCands = game.getAnkanCandidates('P0');
    if (ankanCands.length > 0) {
      ankanCands.forEach(t => {
        const btn = this.makeActionBtn(`暗カン${tileToDisplay(t)}`, 'kan');
        btn.onclick = () => {
          bar.innerHTML = '';
          game.doAnkan('P0', t);
          this.showToast('暗カン');
          if (typeof showActionSplash === 'function') showActionSplash('カン！', 'kan');
          this.render();
          // 嶺上ツモ
          const rinshan = game.drawRinshan('P0');
          if (rinshan) {
            s.drawnTile = rinshan;
            const ra = game.checkAgariTsumo('P0', rinshan);
            this.render();
            if (ra) {
              this.showAgari('P0', ra, true);
              return;
            }
            this.setupMyTurnButtons(rinshan);
          }
        };
        bar.appendChild(btn);
      });
    }
    
    // 加カン（リーチ後は待ち変化なしのもののみ候補に含まれる）
    const kakanCands = game.getKakanCandidates('P0');
    if (kakanCands.length > 0) {
      kakanCands.forEach(t => {
        const btn = this.makeActionBtn(`加カン${tileToDisplay(t)}`, 'kan');
        btn.onclick = () => {
          bar.innerHTML = '';
          game.doKakan('P0', t);
          this.showToast('加カン');
          if (typeof showActionSplash === 'function') showActionSplash('カン！', 'kan');
          this.render();
          const rinshan = game.drawRinshan('P0');
          if (rinshan) {
            s.drawnTile = rinshan;
            const ra = game.checkAgariTsumo('P0', rinshan);
            this.render();
            if (ra) {
              this.showAgari('P0', ra, true);
              return;
            }
            this.setupMyTurnButtons(rinshan);
          }
        };
        bar.appendChild(btn);
      });
    }
    
    // 北抜き
    if (game.hasKita('P0')) {
      const btn = this.makeActionBtn('抜北', 'kita');
      btn.onclick = () => {
        bar.innerHTML = '';
        game.doKitaPull('P0');
        this.showToast('北抜き');
        if (typeof showActionSplash === 'function') showActionSplash('北！', 'kita', 700);
        this.render();
        
        // CPUの北ポン/カン応答チェック
        if (this.checkKitaClaimResponse('P0')) {
          return;
        }
        
        // 嶺上ツモ済み、ツモアガリ判定
        const newDrawn = me.hand[me.hand.length - 1];
        s.drawnTile = newDrawn;
        const ra = game.checkAgariTsumo('P0', newDrawn);
        if (ra) {
          this.showAgari('P0', ra, true);
          return;
        }
        this.setupMyTurnButtons(newDrawn);
      };
      bar.appendChild(btn);
    }
  },
  
  // FEVER制限中の手牌描画：最後の牌（ツモ牌）のみクリック可能
  renderMyHandFeverRestricted(drawn) {
    const me = game.state.players[0];
    const handEl = document.getElementById('my-hand');
    const tiles = handEl.querySelectorAll('.tile');
    const lastIdx = me.hand.length - 1;
    tiles.forEach((el, i) => {
      const newEl = el.cloneNode(true);
      el.parentNode.replaceChild(newEl, el);
      if (i === lastIdx) {
        newEl.classList.add('selectable');
        newEl.classList.remove('disabled');
        newEl.addEventListener('click', () => this.handleDiscard(i, drawn));
      } else {
        newEl.classList.remove('selectable');
        newEl.classList.add('disabled');
      }
    });
  },
  
  makeActionBtn(text, cls) {
    const btn = document.createElement('button');
    btn.className = `action-btn ${cls}`;
    btn.textContent = text;
    return btn;
  },
  
  declareMyReach(asFuriten = false) {
    const me = game.state.players[0];
    
    // リーチ可能な切り牌候補を判定
    // 通常リーチ：切ったあとフリテンにならない打牌
    // フリテンリーチ：切ったあとフリテンになる打牌（または通常リーチ含めて全部）
    const reachOptions = [];
    const ownDiscards = me.discards.map(d => tileBase(d.tile));
    
    for (let i = 0; i < me.hand.length; i++) {
      // 北は河に捨てられないのでリーチ候補から除外
      if (me.hand[i] === 'z4') continue;
      
      const test = [...me.hand];
      test.splice(i, 1);
      if (isTenpai(test, me.melds)) {
        const waits = getWaitingTiles(test, me.melds);
        const isFuriten = waits.some(w => ownDiscards.includes(tileBase(w)));
        if (asFuriten) {
          // フリテンリーチ：フリテンの打牌のみ選べる
          if (isFuriten) reachOptions.push(i);
        } else {
          // 通常リーチ：フリテンにならない打牌のみ
          if (!isFuriten) reachOptions.push(i);
        }
      }
    }
    
    const handEl = document.getElementById('my-hand');
    const tiles = handEl.querySelectorAll('.tile');
    
    const bar = document.getElementById('action-bar');
    bar.innerHTML = '';
    const cancelBtn = this.makeActionBtn('キャンセル', 'skip');
    cancelBtn.onclick = () => {
      this.setupMyTurnButtons(game.state.drawnTile);
      this.render();
    };
    bar.appendChild(cancelBtn);
    
    this.showToast(asFuriten ? 'フリテンリーチ：切る牌を選んで' : '切る牌を選んでリーチ');
    
    // 該当牌のみクリック可能化
    tiles.forEach((el, i) => {
      const newEl = el.cloneNode(true);
      el.parentNode.replaceChild(newEl, el);
      if (reachOptions.includes(i)) {
        newEl.classList.add('selectable');
        newEl.classList.remove('disabled');
        if (asFuriten) {
          newEl.style.outline = '2px solid #ff8c00';
        }
        newEl.addEventListener('click', () => {
          // 切る牌を取得（FEVER判定で除外するため）
          const reachDiscardTile = me.hand[i];
          // reachTypeを 'furiten' or 'normal' に
          const { trigger } = game.declareReach('P0', asFuriten ? 'furiten' : 'normal', reachDiscardTile);
          if (trigger) {
            this.showFeverEffect(trigger);
          }
          this.showToast(asFuriten ? 'フリテンリーチ！' : 'リーチ！');
          if (typeof showActionSplash === 'function') showActionSplash('リーチ！', 'reach');
          
          game.discardTile('P0', reachDiscardTile, false, i);
          bar.innerHTML = '';
          this.render();
          setTimeout(() => {
            this.handleAfterDiscard('P0', reachDiscardTile);
          }, 500);
        });
      } else {
        newEl.classList.remove('selectable');
        newEl.classList.add('disabled');
      }
    });
  },
  
  // FEVERリーチ宣言（七筒/七萬の独立暗刻を維持したまま）
  declareMyFever(feverOpt) {
    const me = game.state.players[0];
    
    const handEl = document.getElementById('my-hand');
    const tiles = handEl.querySelectorAll('.tile');
    
    const validIdxs = new Set(feverOpt.discardOptions.map(o => o.discardIdx));
    
    const bar = document.getElementById('action-bar');
    bar.innerHTML = '';
    const cancelBtn = this.makeActionBtn('キャンセル', 'skip');
    cancelBtn.onclick = () => {
      this.setupMyTurnButtons(game.state.drawnTile);
      this.render();
    };
    bar.appendChild(cancelBtn);
    
    const triggerLabels = {
      'p7': '⑦筒の独立暗刻でFEVER',
      'm7': '⑦萬の独立暗刻でFEVER',
      'double': 'W⑦の独立暗刻でWフィーバー',
    };
    this.showToast(`★切る牌を選んで${triggerLabels[feverOpt.trigger]}！`, 3000);
    
    tiles.forEach((el, i) => {
      const newEl = el.cloneNode(true);
      el.parentNode.replaceChild(newEl, el);
      if (validIdxs.has(i)) {

      const ra = game.checkAgariTsumo('P0', newDrawn);
      if (ra) { this.showAgari('P0', ra, true); return; }

  handleDiscard(idx, tile) {
    try {
      const me = game.state.players[0];
      
      // リーチ後はツモ牌（最後の牌）のみ切れる（北抜きは別処理）
      if (me.isReached && tile !== 'z4') {
        const tsumoIdx = me.hand.length - 1;
        if (idx !== tsumoIdx) {
          this.showToast('リーチ後はツモ切りのみ');
          return;
        }
      }
      
      // 北は河に捨てられない → 自動的に北抜きに振り替え
      if (tile === 'z4') {
        // リーチ中の北抜きは、北が当たり牌でなければ可能
        if (me.isReached) {
          // 北抜き前の手牌で待ち牌を取得
          // リーチ後の手牌は13枚（雀頭+面子）+ ツモ牌1 = 14枚
          // ツモ牌を除いた13枚が「リーチ時の待ち形」
          const tsumoTile = me.hand[me.hand.length - 1];
          const handWithoutTsumo = me.hand.slice(0, -1);
          const waits = getWaitingTiles(handWithoutTsumo, me.melds);
          
          if (waits.includes('z4')) {
            this.showToast('北は当たり牌のため抜けません');
            return;
          }
          // 北が当たり牌でない場合は抜ける
        }
        game.doKitaPull('P0');
        this.showToast('北抜き');
        this.render();
        // 嶺上ツモ済み、続きの判定
        const newDrawn = me.hand[me.hand.length - 1];
        game.state.drawnTile = newDrawn;
        const ra = game.checkAgariTsumo('P0', newDrawn);
        if (ra) {
          this.showAgari('P0', ra, true);
          return;
        }
        // リーチ中なら強制ツモ切り、それ以外は通常選択
        if (me.isReached) {
          // リーチ中は嶺上ツモ牌を切る（または上がる）
          // 既にツモアガリ判定済みなので、ツモ切り処理
          setTimeout(() => {
            game.discardTile('P0', newDrawn, true, me.hand.length - 1);
            this.render();
            setTimeout(() => this.handleAfterDiscard('P0', newDrawn), 300);
          }, 500);
          return;
        }
        this.setupMyTurnButtons(newDrawn);
        return;
      }
      
      const isTsumogiri = (idx === me.hand.length - 1);
      game.discardTile('P0', tile, isTsumogiri, idx);
      document.getElementById('action-bar').innerHTML = '';
      this.render();
      setTimeout(() => this.handleAfterDiscard('P0', tile), 300);
    } catch (err) {
      console.error('handleDiscard error:', err);
      this.showToast('エラー: ' + err.message);
    }
  },
  
  delay(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
  },
};

// ============================
// 花火エンジン（スタート画面）
// ============================
(function() {
  const canvas = document.getElementById('fireworks-canvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  let particles = [];
  let animId;

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  function randomColor() {
    const cols = ['#ff2d55','#ffd700','#ff9800','#00e5ff','#ff00aa','#ffffff','#a0f0a0'];
    return cols[Math.floor(Math.random() * cols.length)];
  }

  function launch() {
    const x = Math.random() * canvas.width;
    const y = canvas.height * (0.2 + Math.random() * 0.5);
    const color = randomColor();
    const count = 40 + Math.floor(Math.random() * 30);
    for (let i = 0; i < count; i++) {
      const angle = (Math.PI * 2 / count) * i + Math.random() * 0.3;
      const speed = 2 + Math.random() * 4;
      particles.push({
        x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        alpha: 1,
        color,
        r: 1.5 + Math.random() * 2,
        decay: 0.012 + Math.random() * 0.008,
        tail: [],
      });
    }
  }

  function animate() {
    // 軌跡を残すための薄い塗り（透明度を下げて文字が見えるように）
    ctx.fillStyle = 'rgba(0,0,0,0.08)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    particles = particles.filter(p => p.alpha > 0.02);
    particles.forEach(p => {
      p.tail.push({x: p.x, y: p.y, a: p.alpha});
      if (p.tail.length > 5) p.tail.shift();
      p.tail.forEach((t, i) => {
        ctx.beginPath();
        ctx.arc(t.x, t.y, p.r * 0.5, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.globalAlpha = t.a * (i / p.tail.length) * 0.4;
        ctx.fill();
      });
      ctx.globalAlpha = p.alpha;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = p.color;
      ctx.fill();
      ctx.globalAlpha = 1;
      p.x += p.vx; p.y += p.vy;
      p.vy += 0.06; // 重力
      p.vx *= 0.98;
      p.alpha -= p.decay;
    });
    animId = requestAnimationFrame(animate);
  }

  let launchInterval = setInterval(launch, 600);
  launch(); launch();
  animate();

  // スタートボタンを押したら停止
  document.getElementById('start-btn').addEventListener('click', () => {
    clearInterval(launchInterval);
    cancelAnimationFrame(animId);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  });
})();

// ============================
// アクション演出（リーチ/ツモ/ロン/ポン等）
// ============================
// カジノチップを描画
// playerIdx: 0=自分(青), 1=CPU1(緑), 2=CPU2(オレンジ)
// chips: 合計枚数
// 黒=10枚分、色=1枚分
// チップが敗者から勝者に飛んでいくアニメーション
// fromEl: 移動元の要素（敗者の行）, toEl: 移動先（勝者の行）, count: チップ数, playerIdx: 色決定
function animateChipTransfer(fromEl, toEl, count, playerIdx) {
  if (!fromEl || !toEl) return;
  const fromRect = fromEl.getBoundingClientRect();
  const toRect = toEl.getBoundingClientRect();
  
  const colorMap = ['blue', 'green', 'orange'];
  const color = colorMap[playerIdx] || 'blue';
  
  // チップ枚数に応じた飛行数（大量に飛ばす）
  const blackCount = Math.min(Math.floor(count / 10), 8);
  const colorCount = Math.min(count - blackCount * 10, 15);
  const flyingChips = [];
  for (let i = 0; i < blackCount; i++) flyingChips.push('black');
  for (let i = 0; i < colorCount; i++) flyingChips.push(color);
  while (flyingChips.length > 20) flyingChips.pop();
  
  // 最低でも8個飛ばす（少ない場合は色チップを足す）
  while (flyingChips.length < 8) flyingChips.push(color);
  
  let lastArrivalDelay = 0;
  
  flyingChips.forEach((chipColor, idx) => {
    const chip = document.createElement('div');
    chip.className = `chip-flying ${chipColor}`;
    
    // 出発地点（敗者の行の中央付近）
    const startX = fromRect.left + fromRect.width * (0.3 + Math.random() * 0.5);
    const startY = fromRect.top + fromRect.height / 2 + (Math.random() - 0.5) * 16;
    
    // 着地点（勝者の行の中央付近）
    const endX = toRect.left + toRect.width * (0.3 + Math.random() * 0.5);
    const endY = toRect.top + toRect.height / 2 + (Math.random() - 0.5) * 16;
    
    // 放物線の頂点（上に大きく弧を描く）
    const midX = (startX + endX) / 2 + (Math.random() - 0.5) * 60;
    const midY = Math.min(startY, endY) - 150 - Math.random() * 80;
    
    chip.style.left = startX + 'px';
    chip.style.top = startY + 'px';
    chip.style.opacity = '0';
    chip.style.transform = 'scale(0.3) rotate(0deg)';
    chip.style.transition = 'none';
    document.body.appendChild(chip);
    
    const launchDelay = idx * 60;
    const arcUpTime = 500;
    const arcDownTime = 600;
    
    // 発射→弧の頂点まで
    setTimeout(() => {
      chip.style.opacity = '1';
      chip.style.transition = `left ${arcUpTime}ms cubic-bezier(0.2, 0.6, 0.4, 1), top ${arcUpTime}ms cubic-bezier(0.2, 0.8, 0.6, 1), transform ${arcUpTime}ms ease-out`;
      chip.style.left = midX + 'px';
      chip.style.top = midY + 'px';
      chip.style.transform = `scale(1.8) rotate(${360 + Math.random() * 360}deg)`;
    }, launchDelay);
    
    // 頂点→着地点
    setTimeout(() => {
      chip.style.transition = `left ${arcDownTime}ms cubic-bezier(0.6, 0, 0.8, 0.4), top ${arcDownTime}ms cubic-bezier(0.4, 0.2, 0.8, 0.6), transform ${arcDownTime}ms ease-in`;
      chip.style.left = endX + 'px';
      chip.style.top = endY + 'px';
      chip.style.transform = `scale(2.2) rotate(${720 + Math.random() * 720}deg)`;
    }, launchDelay + arcUpTime);
    
    // 飛行中のトレイル（光の尾）
    setTimeout(() => {
      const trailInterval = setInterval(() => {
        const rect = chip.getBoundingClientRect();
        if (rect.left === 0 && rect.top === 0) return;
        const trail = document.createElement('div');
        trail.className = 'chip-trail';
        trail.style.left = (rect.left + rect.width / 2) + 'px';
        trail.style.top = (rect.top + rect.height / 2) + 'px';
        trail.style.color = window.getComputedStyle(chip).color;
        document.body.appendChild(trail);
        setTimeout(() => trail.remove(), 500);
      }, 40);
      setTimeout(() => clearInterval(trailInterval), arcUpTime + arcDownTime - 100);
    }, launchDelay);
    
    // 着弾時の派手な爆発エフェクト
    const arrivalTime = launchDelay + arcUpTime + arcDownTime;
    setTimeout(() => {
      const rect = chip.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      
      // 中心の爆発
      const impact = document.createElement('div');
      impact.className = 'chip-impact';
      impact.style.left = cx + 'px';
      impact.style.top = cy + 'px';
      document.body.appendChild(impact);
      setTimeout(() => impact.remove(), 600);
      
      // 星型に飛び散る火花
      for (let s = 0; s < 8; s++) {
        const spark = document.createElement('div');
        const angle = (Math.PI * 2 / 8) * s;
        const dist = 40 + Math.random() * 30;
        const sx = Math.cos(angle) * dist;
        const sy = Math.sin(angle) * dist;
        spark.style.cssText = `
          position: fixed;
          left: ${cx}px;
          top: ${cy}px;
          width: 6px;
          height: 6px;
          background: #ffd700;
          border-radius: 50%;
          box-shadow: 0 0 8px #ffd700, 0 0 16px #ff8800;
          z-index: 602;
          pointer-events: none;
          transform: translate(-50%, -50%);
          transition: transform 0.5s ease-out, opacity 0.5s ease-out;
        `;
        document.body.appendChild(spark);
        setTimeout(() => {
          spark.style.transform = `translate(calc(-50% + ${sx}px), calc(-50% + ${sy}px)) scale(0.3)`;
          spark.style.opacity = '0';
        }, 10);
        setTimeout(() => spark.remove(), 600);
      }
      
      // チップを縮小してフェードアウト
      chip.style.transition = 'opacity 0.3s, transform 0.3s';
      chip.style.opacity = '0';
      chip.style.transform += ' scale(0.3)';
    }, arrivalTime);
    
    setTimeout(() => chip.remove(), arrivalTime + 500);
    lastArrivalDelay = Math.max(lastArrivalDelay, arrivalTime);
  });
  
  // 全チップ到着後、勝者の行が派手に光る
  setTimeout(() => {
    toEl.classList.add('winner-receive-flash');
    setTimeout(() => toEl.classList.remove('winner-receive-flash'), 1800);
    
    // 勝者の周りに金色の波紋
    const toRectNow = toEl.getBoundingClientRect();
    const cx = toRectNow.left + toRectNow.width / 2;
    const cy = toRectNow.top + toRectNow.height / 2;
    for (let i = 0; i < 3; i++) {
      setTimeout(() => {
        const ring = document.createElement('div');
        ring.style.cssText = `
          position: fixed;
          left: ${cx}px;
          top: ${cy}px;
          width: 100px;
          height: 100px;
          border: 3px solid #ffd700;
          border-radius: 50%;
          z-index: 599;
          pointer-events: none;
          transform: translate(-50%, -50%) scale(0);
          opacity: 1;
          transition: transform 1s ease-out, opacity 1s ease-out;
          box-shadow: 0 0 20px #ffd700;
        `;
        document.body.appendChild(ring);
        setTimeout(() => {
          ring.style.transform = 'translate(-50%, -50%) scale(3)';
          ring.style.opacity = '0';
        }, 10);
        setTimeout(() => ring.remove(), 1100);
      }, i * 200);
    }
  }, lastArrivalDelay - 200);
  
  // 振動（モバイル）
  if (navigator.vibrate) {
    navigator.vibrate([30, 80, 50, 80, 80, 80, 100, 80, 120]);
  }
}

function makeChipStack(chips, playerIdx, large = false) {
  const colorMap = ['blue', 'green', 'orange'];
  const colorHexMap = ['#5599ff', '#66bb6a', '#ffa040'];
  const color = colorMap[playerIdx] || 'blue';
  const colorHex = colorHexMap[playerIdx] || '#5599ff';
  
  const blackCount = Math.floor(chips / 10);
  const colorCount = chips % 10;
  
  const stack = document.createElement('span');
  stack.className = 'chip-stack' + (large ? ' large' : '');
  
  // 黒チップの山（最大8枚まで表示、それ以上は数字で）
  if (blackCount > 0) {
    const pile = document.createElement('span');
    pile.className = 'chip-pile';
    const displayBlack = Math.min(blackCount, 8);
    for (let i = 0; i < displayBlack; i++) {
      const c = document.createElement('span');
      c.className = 'chip black';
      pile.appendChild(c);
    }
    stack.appendChild(pile);
    // 黒チップの枚数ラベル
    const lbl = document.createElement('span');
    lbl.style.cssText = 'font-family:"Bungee",sans-serif; font-size:9px; color:#ffd700; align-self:flex-end; margin-left:1px; text-shadow: 0 0 3px rgba(255,215,0,0.6);';
    lbl.textContent = `×${blackCount}`;
    stack.appendChild(lbl);
  }
  
  // 色チップの山
  if (colorCount > 0) {
    const pile = document.createElement('span');
    pile.className = 'chip-pile';
    for (let i = 0; i < colorCount; i++) {
      const c = document.createElement('span');
      c.className = 'chip ' + color;
      pile.appendChild(c);
    }
    stack.appendChild(pile);
    // 色チップの枚数ラベル
    const lbl = document.createElement('span');
    lbl.style.cssText = `font-family:"Bungee",sans-serif; font-size:9px; color:${colorHex}; align-self:flex-end; margin-left:1px; text-shadow: 0 0 3px ${colorHex}99;`;
    lbl.textContent = `×${colorCount}`;
    stack.appendChild(lbl);
  }
  
  return stack;
}

function showActionSplash(text, type, duration = 900) {
  const el = document.getElementById('action-splash');
  el.innerHTML = '';
  
  // ロン/ツモ/リーチ時は特別演出：カットイン + 画面フラッシュ + 雷
  const isMajorAction = type === 'ron' || type === 'tsumo' || type === 'reach';
  const isRonOrTsumo = type === 'ron' || type === 'tsumo';
  
  if (isMajorAction) {
    showCutin(text, type);
  }
  
  if (isRonOrTsumo) {
    // 画面フラッシュ（白）
    const flash = document.createElement('div');
    flash.style.cssText = `
      position:fixed; inset:0; z-index:199;
      background: ${type === 'ron' ? 'radial-gradient(circle, rgba(255,80,100,0.9), rgba(255,0,0,0.3) 50%, transparent 80%)' : 'radial-gradient(circle, rgba(100,230,255,0.9), rgba(0,200,255,0.3) 50%, transparent 80%)'};
      pointer-events:none;
      animation: flash-fade 0.6s ease-out forwards;
    `;
    el.appendChild(flash);
    
    // 雷エフェクト（SVGで8本の稲妻を中央から放射）
    const lightning = document.createElement('div');
    lightning.style.cssText = 'position:fixed; inset:0; pointer-events:none; z-index:200;';
    const cx = window.innerWidth / 2;
    const cy = window.innerHeight / 2;
    const color = type === 'ron' ? '#ff2d55' : '#00e5ff';
    const glowColor = type === 'ron' ? '#ffd700' : '#ffffff';
    
    let svgPaths = '';
    const bolts = 8;
    for (let i = 0; i < bolts; i++) {
      const angle = (Math.PI * 2 / bolts) * i + Math.random() * 0.3;
      const len = Math.max(window.innerWidth, window.innerHeight) * 0.7;
      let pathData = `M ${cx} ${cy}`;
      const segments = 6;
      for (let j = 1; j <= segments; j++) {
        const t = j / segments;
        const r = len * t;
        const baseX = cx + Math.cos(angle) * r;
        const baseY = cy + Math.sin(angle) * r;
        const perpAngle = angle + Math.PI / 2;
        const offset = (Math.random() - 0.5) * 40 * (1 - t);
        const x = baseX + Math.cos(perpAngle) * offset;
        const y = baseY + Math.sin(perpAngle) * offset;
        pathData += ` L ${x.toFixed(0)} ${y.toFixed(0)}`;
      }
      svgPaths += `<path d="${pathData}" stroke="${color}" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>`;
      svgPaths += `<path d="${pathData}" stroke="${glowColor}" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1"/>`;
    }
    lightning.innerHTML = `<svg width="100%" height="100%" style="filter: drop-shadow(0 0 8px ${color}) drop-shadow(0 0 16px ${color});">${svgPaths}</svg>`;
    lightning.style.animation = 'lightning-flash 0.5s ease-out forwards';
    el.appendChild(lightning);
    
    // 火花パーティクル
    const sparkContainer = document.createElement('div');
    sparkContainer.style.cssText = 'position:fixed; inset:0; pointer-events:none; z-index:201;';
    for (let i = 0; i < 30; i++) {
      const spark = document.createElement('div');
      const angle = Math.random() * Math.PI * 2;
      const distance = 50 + Math.random() * 250;
      const tx = Math.cos(angle) * distance;
      const ty = Math.sin(angle) * distance;
      spark.style.cssText = `
        position:absolute;
        left: 50%; top: 50%;
        width: 4px; height: 4px;
        background: ${color};
        border-radius: 50%;
        box-shadow: 0 0 8px ${color}, 0 0 16px ${glowColor};
        --tx: ${tx}px; --ty: ${ty}px;
        animation: spark-fly 0.8s ease-out forwards;
      `;
      sparkContainer.appendChild(spark);
    }
    el.appendChild(sparkContainer);
  }
  
  // メインテキスト（カットインがある場合はスキップ）
  if (!isMajorAction) {
    const t = document.createElement('div');
    t.className = `action-splash-text ${type}`;
    t.textContent = text;
    el.appendChild(t);
  }
  
  // 振動（ハプティクス）
  if (navigator.vibrate) {
    if (type === 'ron') navigator.vibrate([120, 40, 80, 40, 120]);
    else if (type === 'tsumo') navigator.vibrate([100, 50, 200]);
    else if (type === 'reach') navigator.vibrate([60, 30, 100]);
    else navigator.vibrate([50]);
  }
  
  const finalDuration = isMajorAction ? 1400 : duration;
  setTimeout(() => { el.innerHTML = ''; }, finalDuration);
}

// ============================
// FEVER花火エンジン（オーバーレイ）
// ============================
function showFeverFireworks(isDouble) {
  const overlay = document.getElementById('fever-overlay');
  const canvas = document.getElementById('fever-canvas');
  const ctx = canvas.getContext('2d');
  const mainText = document.getElementById('fever-main-text');
  const subText = document.getElementById('fever-sub-text');

  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  if (isDouble) {
    mainText.className = 'fever-main-text double';
    mainText.textContent = 'W-FEVER!!';
    subText.textContent = '✨✨ DOUBLE FEVER ✨✨';
    mainText.style.color = '';
  } else {
    mainText.className = 'fever-main-text';
    mainText.textContent = 'FEVER!';
    subText.textContent = '🎰 FEVER START 🎰';
  }

  overlay.classList.add('show');
  if (navigator.vibrate) navigator.vibrate([100, 50, 100, 50, 200]);

  let particles = [];
  let animId2;

  function feverLaunch() {
    const cx = canvas.width / 2 + (Math.random() - 0.5) * canvas.width * 0.8;
    const cy = canvas.height / 2 + (Math.random() - 0.5) * canvas.height * 0.6;
    const cols = isDouble
      ? ['#ffffff','#ffd700','#ffec5c','#fffde7']
      : ['#ff2d55','#ffd700','#ff9800','#ff00aa','#ffffff','#00e5ff'];
    const color = cols[Math.floor(Math.random() * cols.length)];
    const count = 60 + Math.floor(Math.random() * 40);
    for (let i = 0; i < count; i++) {
      const angle = (Math.PI * 2 / count) * i;
      const speed = 3 + Math.random() * 6;
      particles.push({
        x: cx, y: cy,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        alpha: 1, color,
        r: 2 + Math.random() * 3,
        decay: 0.015 + Math.random() * 0.01,
      });
    }
  }

  function feverAnim() {
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    particles = particles.filter(p => p.alpha > 0.02);
    particles.forEach(p => {
      ctx.globalAlpha = p.alpha;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = p.color;
      ctx.fill();
      ctx.globalAlpha = 1;
      p.x += p.vx; p.y += p.vy;
      p.vy += 0.08;
      p.vx *= 0.97;
      p.alpha -= p.decay;
    });
    animId2 = requestAnimationFrame(feverAnim);
  }

  feverLaunch(); feverLaunch(); feverLaunch();
  const li = setInterval(feverLaunch, 250);
  feverAnim();

  setTimeout(() => {
    clearInterval(li);
    cancelAnimationFrame(animId2);
    overlay.classList.remove('show');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    // FEVER中バナー表示
    document.getElementById('fever-banner').classList.add('active');
    document.getElementById('fever-active-label').classList.add('active');
  }, 3000);
}

function hideFeverBanner() {
  document.getElementById('fever-banner').classList.remove('active');
  document.getElementById('fever-active-label').classList.remove('active');
}
</script>
</body>
</html>
