<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FEVER MJ - 対CPU版 v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Bungee&family=Yuji+Mai&family=Yuji+Boku&family=Reggae+One&display=swap" rel="stylesheet">
<style>
@font-face {
  font-family: 'GLMahjongTile';
  src: url('https://db.onlinewebfonts.com/t/767c594fc1223417cbc3b29445f4d021.woff2') format('woff2'),
       url('https://db.onlinewebfonts.com/t/767c594fc1223417cbc3b29445f4d021.woff') format('woff'),
       url('https://db.onlinewebfonts.com/t/767c594fc1223417cbc3b29445f4d021.ttf') format('truetype');
  font-weight: normal;
  font-style: normal;
}
</style>
<style>
:root {
  --bg-deep: #0a0e1a;
  --bg-felt: #0f3a2c;
  --bg-felt-dark: #082018;
  --gold: #ffd700;
  --gold-bright: #ffec5c;
  --gold-dim: #c9a000;
  --red: #ff2d55;
  --red-deep: #c5002a;
  --green-pop: #00ff88;
  --cyan-pop: #00e5ff;
  --magenta: #ff00aa;
  --tile-cream: #fff8e1;
  --tile-bg: #ffffff;
  --tile-edge: #e8d9b0;
  --tile-edge-dark: #c9a96e;
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  width: 100%; height: 100%; overflow: hidden;
  background: var(--bg-deep); color: white;
  font-family: 'Reggae One', cursive; user-select: none;
}
body::before {
  content: ''; position: fixed; inset: 0; z-index: -2;
  background:
    radial-gradient(ellipse at top left, #1a0033 0%, transparent 40%),
    radial-gradient(ellipse at bottom right, #330011 0%, transparent 40%),
    radial-gradient(ellipse at center, #0a0e1a 0%, #000 100%);
}

.app {
  position: relative;
  width: 100%; max-width: 500px;
  margin: 0 auto;
  height: 100vh;
  display: grid;
  grid-template-rows: 38px auto 1fr auto auto;
  background: radial-gradient(ellipse at center, var(--bg-felt) 0%, var(--bg-felt-dark) 80%);
  box-shadow: inset 0 0 80px rgba(0,0,0,0.7);
  overflow: hidden;
  gap: 4px;
  padding: 4px;
}

/* ヘッダー */
.header {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  padding: 0 6px;
  background: linear-gradient(180deg, rgba(0,0,0,0.7), transparent);
  border-bottom: 1px solid rgba(255,215,0,0.2);
  z-index: 10;
  gap: 4px;
  border-radius: 4px;
}
.kyoku-info { display: flex; align-items: baseline; gap: 4px; }
.kyoku-info .round {
  font-family: 'Yuji Mai', serif; font-size: 14px;
  color: var(--gold); letter-spacing: 1px;
}
.kyoku-info .meta {
  font-family: 'DotGothic16', monospace; font-size: 9px;
  color: rgba(255,255,255,0.5);
}
.center-badges { display: flex; gap: 3px; justify-content: center; flex-wrap: nowrap; overflow: hidden; }
.badge {
  font-family: 'DotGothic16', monospace; font-size: 9px;
  padding: 2px 5px; border-radius: 2px; white-space: nowrap;
}
.badge.honba { background: rgba(255,215,0,0.15); color: var(--gold); border: 1px solid var(--gold-dim); }
.badge.reach { background: rgba(0,229,255,0.15); color: var(--cyan-pop); border: 1px solid var(--cyan-pop); }
.badge.ware { background: rgba(255,45,85,0.2); color: var(--red); border: 1px solid var(--red); animation: ware-pulse 2s infinite; }
@keyframes ware-pulse { 0%, 100% { box-shadow: 0 0 4px var(--red); } 50% { box-shadow: 0 0 10px var(--red); } }

.menu-btn {
  width: 26px; height: 26px;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 4px; color: white; font-size: 14px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
}

/* ============================
   卓本体（俯瞰視点）
   ============================ */
.table-area {
  position: relative;
  width: 100%;
  aspect-ratio: 1 / 1;
  max-height: 60vh;
  margin: 4px auto;
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 4px 16px rgba(0,0,0,0.6), inset 0 0 60px rgba(0,0,0,0.5);
}

/* フェルト調背景 */
.table-felt {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse at center, #1a5d2c 0%, #0d4020 60%, #062812 100%);
  border-radius: 16px;
  border: 3px solid #8b6914;
  box-shadow:
    inset 0 0 40px rgba(0,0,0,0.6),
    inset 0 0 100px rgba(0,0,0,0.3);
}
.table-felt::before {
  content: '';
  position: absolute;
  inset: 8px;
  border: 1px solid rgba(255,215,0,0.3);
  border-radius: 10px;
  pointer-events: none;
}
.table-felt::after {
  /* 中央の薄い装飾円 */
  content: '';
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 35%; height: 35%;
  border-radius: 50%;
  border: 1px solid rgba(255,215,0,0.15);
  pointer-events: none;
}

/* プレイヤー席 */
.seat {
  position: absolute;
  z-index: 2;
}

/* CPU1（左席） */
.seat-left {
  left: 0;
  top: 0;
  bottom: 0;
  width: 20%;
  display: flex;
  flex-direction: column;
  padding: 6px 4px;
}

/* CPU2（右席） */
.seat-right {
  right: 0;
  top: 0;
  bottom: 0;
  width: 20%;
  display: flex;
  flex-direction: column;
  padding: 6px 4px;
  align-items: flex-end;
}

/* 席情報（名前・点数） */
.seat-info {
  display: flex;
  align-items: center;
  gap: 4px;
  background: rgba(0,0,0,0.65);
  border: 1px solid rgba(255,215,0,0.3);
  border-radius: 4px;
  padding: 3px 6px;
  font-size: 10px;
  margin-bottom: 4px;
}
.seat-info .wind {
  width: 18px; height: 18px; line-height: 18px;
  text-align: center;
  background: var(--gold); color: #000;
  border-radius: 50%;
  font-family: 'Yuji Mai', serif; font-size: 11px;
  font-weight: bold;
}
.seat-info .name {
  font-family: 'DotGothic16', monospace;
  color: white;
  font-size: 10px;
}
.seat-stats {
  background: rgba(0,0,0,0.65);
  border: 1px solid rgba(255,215,0,0.3);
  border-radius: 4px;
  padding: 3px 6px;
  font-family: 'DotGothic16', monospace;
  font-size: 11px;
  margin-bottom: 4px;
}
.seat-stats .score {
  color: var(--gold);
  font-weight: bold;
}
.seat-stats .chips {
  color: var(--cyan-pop);
  font-size: 9px;
}

/* 他家の手牌（横向きで枚数のみ表示） */
.seat-hand {
  display: flex;
  flex-wrap: wrap;
  gap: 1px;
  margin-bottom: 4px;
  max-width: 100%;
}
.seat-hand .tile {
  width: 14px;
  height: 20px;
  border-radius: 2px;
  background: linear-gradient(180deg, #2a2a2a, #1a1a1a);
  border: 1px solid #444;
  flex-shrink: 0;
}
.seat-hand-left .tile.tsumo,
.seat-hand-right .tile.tsumo {
  background: linear-gradient(180deg, #4a3a1a, #3a2a0a);
}

/* 副露表示 */
.seat-melds {
  display: flex;
  flex-direction: column;
  gap: 2px;
  font-size: 8px;
  max-width: 100%;
}
.seat-melds .meld {
  display: flex;
  gap: 1px;
  background: rgba(0,0,0,0.5);
  border-radius: 2px;
  padding: 1px;
}
.seat-melds .meld .tile {
  width: 12px;
  height: 16px;
  font-size: 7px;
  border-radius: 1px;
}

/* 北抜き表示 */
.seat-kita {
  display: flex;
  gap: 1px;
  flex-wrap: wrap;
  margin-top: 4px;
  align-items: center;
}
.seat-kita:empty { display: none; }
.seat-kita .tile.kita-small {
  width: 12px;
  height: 16px;
  font-size: 7px;
  border-radius: 1px;
  border-width: 1px;
  flex-shrink: 0;
}
.seat-kita .opp-kita-label,
.seat-kita .opp-kita-count {
  font-family: 'DotGothic16', monospace;
  font-size: 8px;
  color: var(--gold);
}

/* 河エリア */
.kawa-area {
  position: absolute;
  z-index: 1;
  padding: 4px;
  background: rgba(0,0,0,0.2);
  border-radius: 4px;
  border: 1px solid rgba(0,0,0,0.3);
}
.kawa-area .kawa-row,
.kawa-area .my-kawa-row {
  display: grid;
  gap: 2px;
  min-width: 0;
}

/* 左の河（CPU1の捨て牌：横6列×3段、横向き） */
.kawa-left {
  left: 24%;
  top: 6%;
  width: 26%;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.kawa-left .kawa-row {
  grid-template-columns: repeat(6, 1fr);
}

/* 右の河（CPU2の捨て牌） */
.kawa-right {
  right: 24%;
  top: 6%;
  width: 26%;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.kawa-right .kawa-row {
  grid-template-columns: repeat(6, 1fr);
}

/* 下の河（自分の捨て牌） */
.kawa-bottom {
  left: 12%;
  right: 12%;
  bottom: 3%;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.kawa-bottom .my-kawa-row {
  grid-template-columns: repeat(10, 1fr);
}

/* 中央パネル */
.center-panel {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  background: rgba(0,0,0,0.75);
  border: 1.5px solid var(--gold-dim);
  border-radius: 8px;
  padding: 6px 8px;
  display: flex;
  flex-direction: column;
  gap: 3px;
  align-items: center;
  justify-content: center;
  width: 90px;
  z-index: 5;
  box-shadow: 0 0 20px rgba(0,0,0,0.6);
}
.wall-count strong {
  font-size: 28px; color: var(--gold);
  display: block; text-align: center; line-height: 1;
  font-family: 'Bungee', sans-serif;
  text-shadow: 0 0 8px rgba(255,215,0,0.8), 0 0 16px rgba(255,215,0,0.4);
  transition: all 0.3s ease;
}
.wall-count strong.warning {
  color: #ff8c00;
  text-shadow: 0 0 10px rgba(255,140,0,0.9), 0 0 20px rgba(255,140,0,0.5);
  animation: wall-warning 0.8s ease-in-out infinite;
}
.wall-count strong.danger {
  color: #ff2d55;
  text-shadow: 0 0 12px rgba(255,45,85,1), 0 0 24px rgba(255,45,85,0.7);
  animation: wall-danger 0.5s ease-in-out infinite;
}
@keyframes wall-warning {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.08); }
}
@keyframes wall-danger {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.15); }
}
.wall-count .last-warn {
  display: block;
  font-family: 'DotGothic16', monospace;
  font-size: 8px;
  color: #ff2d55;
  margin-top: 2px;
  letter-spacing: 1px;
  animation: warn-blink 0.6s steps(2) infinite;
}
@keyframes warn-blink {
  0%, 50% { opacity: 1; }
  51%, 100% { opacity: 0.3; }
}
.wall-count .label {
  font-size: 10px; color: var(--gold-dim);
  display: block; text-align: center;
  margin-top: -2px;
  letter-spacing: 2px;
}
.dora-section {
  width: 100%;
  border-top: 1px solid var(--gold-dim);
  padding-top: 4px;
  text-align: center;
}
.dora-label {
  font-family: 'DotGothic16', monospace;
  font-size: 9px; color: var(--gold-dim);
  margin-bottom: 2px;
}
.dora-tiles {
  display: flex; justify-content: center; gap: 2px;
}
.my-dora-count {
  font-family: 'DotGothic16', monospace;
  font-size: 9px; color: var(--cyan-pop);
  margin-top: 3px;
}
.seat.reached {
  background: rgba(0,229,255,0.15);
  border: 1px solid var(--cyan-pop);
  box-shadow: 0 0 10px rgba(0,229,255,0.4);
  animation: reach-frame 1.5s ease-in-out infinite;
  border-radius: 4px;
}
@keyframes reach-frame {
  0%, 100% { box-shadow: 0 0 10px rgba(0,229,255,0.4); }
  50% { box-shadow: 0 0 18px rgba(0,229,255,0.7); }
}
.reach-badge {
  position: absolute; top: -4px; right: -2px;
  background: linear-gradient(135deg, var(--cyan-pop), #00aacc);
  color: #001a1f;
  font-family: 'Bungee', sans-serif; font-size: 10px;
  letter-spacing: 1px;
  padding: 2px 6px;
  border-radius: 3px;
  border: 1.5px solid white;
  box-shadow: 0 0 8px var(--cyan-pop), 0 0 16px var(--cyan-pop);
  transform: rotate(-6deg);
  animation: reach-pop 0.5s ease-out;
  z-index: 20;
  text-shadow: 1px 1px 0 white;
  white-space: nowrap;
}
@keyframes reach-pop {
  0% { transform: rotate(-6deg) scale(0); }
  60% { transform: rotate(-6deg) scale(1.3); }
  100% { transform: rotate(-6deg) scale(1); }
}
.seat.fever {
  background: linear-gradient(90deg, rgba(255,45,85,0.2), rgba(255,215,0,0.2), rgba(255,0,170,0.2));
  background-size: 200% 100%;
  border: 1px solid var(--gold);
  animation: fever-frame 1.2s linear infinite;
  border-radius: 4px;
}
@keyframes fever-frame {
  0% { background-position: 0% 0; } 100% { background-position: 200% 0; }
}
.fever-badge {
  position: absolute; top: -5px; right: -2px;
  background: linear-gradient(45deg, var(--red), var(--gold), var(--magenta));
  background-size: 300% 300%;
  color: white;
  font-family: 'Bungee', sans-serif; font-size: 11px;
  padding: 2px 6px;
  border-radius: 3px;
  border: 1.5px solid white;
  box-shadow: 0 0 12px var(--gold), 0 0 20px var(--red);
  transform: rotate(-8deg);
  animation: fever-shine 1s linear infinite, fever-bounce 0.4s ease-in-out infinite;
  z-index: 20;
  text-shadow: 1px 1px 0 #000;
  white-space: nowrap;
}
@keyframes fever-shine { 0% { background-position: 0% 50%; } 100% { background-position: 300% 50%; } }
@keyframes fever-bounce { 0%, 100% { transform: rotate(-8deg) scale(1); } 50% { transform: rotate(-8deg) scale(1.08); } }

/* ===== 河エリア（旧 kawa-zone は新レイアウトで置き換え済み） ===== */
.kawa-row {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 2px;
  min-width: 0;
}

/* ===== 自分の河（旧 my-kawa は新レイアウトで置き換え済み） ===== */
.my-kawa {
  background: rgba(0,30,15,0.4);
  border-radius: 4px;
  border: 1px solid rgba(255,215,0,0.2);
  padding: 3px;
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-height: 30px;
}
.my-kawa-label {
  font-family: 'DotGothic16', monospace;
  font-size: 8px;
  color: rgba(255,215,0,0.6);
  text-align: center;
  letter-spacing: 1px;
  display: none; /* 河に牌があるときだけ出すと邪魔なので非表示 */
}
.my-kawa-row {
  display: grid;
  grid-template-columns: repeat(10, 1fr);
  gap: 2px;
  min-width: 0;
}

/* 牌 */
.tile {
  display: inline-flex;
  align-items: center; justify-content: center;
  background: linear-gradient(180deg, var(--tile-bg) 0%, var(--tile-cream) 50%, #fff5d6 100%);
  border-radius: 4px 4px 3px 3px;
  border: 1.5px solid var(--tile-edge-dark);
  box-shadow:
    inset 0 1px 0 white,
    inset 0 -2px 3px var(--tile-edge),
    0 2px 0 var(--tile-edge-dark),
    0 3px 4px rgba(0,0,0,0.4);
  position: relative;
  font-family: 'Reggae One', cursive;
  font-weight: 900;
  flex-shrink: 0;
  text-shadow: 0 1px 0 rgba(255,255,255,0.6);
}
.tile::before {
  content: '';
  position: absolute;
  top: 1px; left: 1px; right: 1px;
  height: 30%;
  background: linear-gradient(180deg, rgba(255,255,255,0.7), transparent);
  border-radius: 3px 3px 0 0;
  pointer-events: none;
}
.tile.kawa-tile {
  width: 100%;
  aspect-ratio: 22 / 30;
  font-size: 14px;
  border-radius: 3px;
  border-width: 1.5px;
  padding: 1px;
  min-width: 0;
}
.tile.my-kawa-tile {
  width: 100%;
  aspect-ratio: 22 / 30;
  font-size: 13px;
  border-radius: 3px;
  border-width: 1.5px;
  padding: 1px;
  min-width: 0;
}
.tile.dora-tile {
  width: 22px; height: 30px; font-size: 13px;
}
.tile.large {
  width: calc((100vw - 24px) / 14 - 2px);
  max-width: 28px;
  aspect-ratio: 22 / 32;
  font-size: 16px;
  cursor: pointer;
  transition: transform 0.1s;
  border-radius: 4px 4px 3px 3px;
}
.tile.large.tsumo-tile {
  width: calc((100vw - 24px) / 14 - 2px);
  max-width: 28px;
  margin-left: 4px;
}
.tile.large:active {
  transform: translateY(2px);
}
.tile.large.selectable {
  cursor: pointer;
}
.tile.large.selectable:hover {
  filter: brightness(1.1);
  transform: translateY(-2px);
}
.tile.large.disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

.tile.suit-m { color: #c62828; }

/* FEVER牌（7萬・7筒）：金色の縁 */
.tile.fever-tile {
  border-color: var(--gold) !important;
  border-width: 2px !important;
  box-shadow:
    inset 0 1px 0 #fff5d6,
    inset 0 -2px 3px #ffd700,
    0 0 6px rgba(255, 215, 0, 0.5),
    0 2px 0 #c9a000,
    0 3px 4px rgba(0,0,0,0.4) !important;
}
.tile.fever-tile.red-five {
  /* 赤五筒は対象外（一応念のため） */
}
.tile.suit-p { color: #1565c0; }
.tile.suit-p.red { background: linear-gradient(180deg, #fff8e1 0%, #ffe0b2 50%, #ffcc80 100%); }
.tile.suit-s { color: #2e7d32; }
.tile.suit-z { color: #1a1a1a; }

/* ====== リアル麻雀牌の内部構造 ====== */
.tile { padding: 1px; }

/* 字牌：中央に大きな漢字 */
.tile-jihai {
  width: 100%; height: 100%;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Yuji Mai', 'Yu Mincho', serif;
  font-weight: 900;
  font-size: 130%;  /* 親フォントサイズより大きく */
  line-height: 1;
  color: #1a1a1a;
}
.tile-jihai.hatsu { color: #1a5d2c; }
.tile-jihai.chun { color: #c62828; }
.tile-jihai.haku {
  border: 2.5px solid #c9a000;
  border-radius: 4px;
  width: 60%; height: 65%;
  margin: auto;
  display: block;
  box-shadow: inset 0 0 0 1px #fff8e1;
}

/* 萬子：数字を上に、「萬」を下に縦並び */
.tile.suit-m {
  flex-direction: column;
  justify-content: center;
  align-items: center;
}
.tile-mn-num {
  font-family: 'Yuji Boku', 'Yuji Mai', 'Yu Mincho', serif;
  font-weight: 900;
  font-size: 75%;
  text-align: center;
  line-height: 1;
  color: #1a1a1a;
  letter-spacing: -2px;
  -webkit-text-stroke: 0.3px #1a1a1a;
}
.tile-mn-lbl {
  font-family: 'Yuji Boku', 'Yuji Mai', 'Yu Mincho', serif;
  font-weight: 900;
  font-size: 50%;
  text-align: center;
  margin-top: 4%;
  line-height: 1;
  letter-spacing: -2px;
  color: #c62828;
  -webkit-text-stroke: 0.3px #c62828;
}
/* 筒子の小サイズは数字青、ラベル青 */
.tile-mn-num.pin { color: #1565c0; }
.tile-mn-lbl.pin { color: #1565c0; }
/* 索子の小サイズは数字緑、ラベル緑 */
.tile-mn-num.sou { color: #1a5d2c; }
.tile-mn-lbl.sou { color: #1a5d2c; }

/* 索子（大サイズ）：SVGコンテナ */
.souzu {
  width: 100%; height: 100%;
  display: flex; align-items: center; justify-content: center;
  padding: 6%;
}
.souzu svg {
  width: 100%; height: 100%;
}
.souzu.souzu-9 {
  display: grid;
  grid-template: 1fr 1fr 1fr / 1fr 1fr 1fr;
  gap: 1%;
  padding: 2%;
}
.bamboo {
  width: 100%; height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  min-width: 0;
  min-height: 0;
}
.bamboo svg {
  width: 100%; 
  height: 100%;
  display: block;
  max-width: 100%;
  max-height: 100%;
}

/* 筒子：SVG車輪型 */
.pinzu {
  width: 100%; height: 100%;
  display: grid;
  padding: 8%;
  position: relative;
  box-sizing: border-box;
  place-content: center;
  place-items: center;
}
.pinzu-dot {
  aspect-ratio: 1;
  width: 100%;
  height: auto;
  max-width: 100%;
  max-height: 100%;
  align-self: center;
  justify-self: center;
  display: flex;
  align-items: center;
  justify-content: center;
}
.pinzu-dot svg {
  width: 100%;
  height: 100%;
  display: block;
}

/* 赤五筒：輝きエフェクト */
.tile.suit-p.red .pinzu-dot svg {
  filter: drop-shadow(0 0 2px rgba(255,80,80,0.7));
}

/* 各数字のレイアウト */
.pinzu-1 { grid-template: 1fr / 1fr; padding: 18%; }
.pinzu-2 { grid-template: 1fr 1fr / 1fr; gap: 6%; padding: 12% 32%; }
/* 3筒：左下→中央→右上の対角線配置（右上がり） */
.pinzu-3 { grid-template: 1fr 1fr 1fr / 1fr 1fr 1fr; gap: 2%; padding: 8%; }
.pinzu-3 .pinzu-dot:nth-child(1) { grid-area: 3/1; }  /* 左下 */
.pinzu-3 .pinzu-dot:nth-child(2) { grid-area: 2/2; }  /* 中央 */
.pinzu-3 .pinzu-dot:nth-child(3) { grid-area: 1/3; }  /* 右上 */
/* 4筒：2x2の四角配置 */
.pinzu-4 { grid-template: 1fr 1fr / 1fr 1fr; gap: 4%; padding: 10% 12%; }
.pinzu-5 { grid-template: 1fr 1fr 1fr / 1fr 1fr 1fr; gap: 2%; padding: 5%; }
.pinzu-5 .pinzu-dot:nth-child(1) { grid-area: 1/1; }
.pinzu-5 .pinzu-dot:nth-child(2) { grid-area: 1/3; }
.pinzu-5 .pinzu-dot:nth-child(3) { grid-area: 2/2; }
.pinzu-5 .pinzu-dot:nth-child(4) { grid-area: 3/1; }
.pinzu-5 .pinzu-dot:nth-child(5) { grid-area: 3/3; }
/* 6筒：上段2つ青、下段2x2の4つ赤（3行2列） */
.pinzu-6 { grid-template: 1fr 1fr 1fr / 1fr 1fr; gap: 3%; padding: 6% 12%; }
.pinzu-6 .pinzu-dot:nth-child(1) { grid-area: 1/1; }
.pinzu-6 .pinzu-dot:nth-child(2) { grid-area: 1/2; }
.pinzu-6 .pinzu-dot:nth-child(3) { grid-area: 2/1; }
.pinzu-6 .pinzu-dot:nth-child(4) { grid-area: 2/2; }
.pinzu-6 .pinzu-dot:nth-child(5) { grid-area: 3/1; }
.pinzu-6 .pinzu-dot:nth-child(6) { grid-area: 3/2; }

/* 7筒：画像通りに正確配置（absolute positioning） */
.pinzu-7 {
  position: relative;
  width: 100%;
  height: 100%;
  display: block !important;
  padding: 0 !important;
}
.pinzu-7 .pinzu-dot {
  position: absolute;
  width: 26%;
  height: 17%;
}
/* 上3つ：左上→中→右下の斜め */
.pinzu-7 .pinzu-dot:nth-child(1) { top: 17%; left: 9%; }
.pinzu-7 .pinzu-dot:nth-child(2) { top: 23%; left: 37%; }
.pinzu-7 .pinzu-dot:nth-child(3) { top: 29%; left: 65%; }
/* 下4つ：2x2 */
.pinzu-7 .pinzu-dot:nth-child(4) { top: 56%; left: 20%; }
.pinzu-7 .pinzu-dot:nth-child(5) { top: 56%; left: 54%; }
.pinzu-7 .pinzu-dot:nth-child(6) { top: 78%; left: 20%; }
.pinzu-7 .pinzu-dot:nth-child(7) { top: 78%; left: 54%; }
.pinzu-8 { grid-template: 1fr 1fr 1fr 1fr / 1fr 1fr; gap: 3%; padding: 8% 18%; }
/* 9筒：縦3個×3列、列優先で配置 */
.pinzu-9 { 
  grid-template: 1fr 1fr 1fr / 1fr 1fr 1fr; 
  grid-auto-flow: column;
  gap: 2%; 
  padding: 4%; 
}

.tile.tsumogiri {
  background: linear-gradient(180deg, #f0e8d8, #e0d4b0);
}

/* ============================
   カジノチップビジュアル
   ============================ */
.chip-stack {
  display: inline-flex;
  align-items: flex-end;
  gap: 1px;
  margin-left: 4px;
  vertical-align: middle;
}
.chip-pile {
  display: flex;
  flex-direction: column-reverse;
  align-items: center;
}
.chip {
  width: 14px;
  height: 4px;
  border-radius: 50%;
  border: 1px solid rgba(0,0,0,0.5);
  margin-top: -2px;
  position: relative;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.3),
    inset 0 -1px 0 rgba(0,0,0,0.3),
    0 1px 2px rgba(0,0,0,0.4);
  flex-shrink: 0;
}
.chip:first-child { margin-top: 0; }
.chip.black {
  background: radial-gradient(ellipse at center, #4a4a4a 0%, #1a1a1a 70%, #000 100%);
  border-color: #ffd700;
  box-shadow:
    inset 0 1px 0 rgba(255,215,0,0.3),
    inset 0 -1px 0 rgba(0,0,0,0.5),
    0 1px 2px rgba(0,0,0,0.6),
    0 0 3px rgba(255,215,0,0.2);
}
.chip.blue {
  background: radial-gradient(ellipse at center, #5599ff 0%, #1565c0 60%, #0d47a1 100%);
  border-color: #fff;
}
.chip.green {
  background: radial-gradient(ellipse at center, #66bb6a 0%, #1a5d2c 60%, #0d3818 100%);
  border-color: #fff;
}
.chip.orange {
  background: radial-gradient(ellipse at center, #ffa040 0%, #e67300 60%, #b35400 100%);
  border-color: #fff;
}
.chip-stack.large .chip {
  width: 22px;
  height: 6px;
  margin-top: -3px;
}

/* テンパイ崩れ牌（切ると聴牌が崩れる） */
.tile.large.danger-tile {
  outline: 2px solid #ff6b00 !important;
  outline-offset: 1px;
  opacity: 0.75;
}
.tile.large.danger-tile::after {
  content: '×';
  position: absolute;
  bottom: 1px;
  right: 2px;
  font-size: 8px;
  color: #ff6b00;
  font-weight: 900;
  line-height: 1;
  font-family: sans-serif;
}

/* リーチ後の待ち牌 */
.tile.large.reach-wait-tile {
  outline: 2.5px solid #00e5ff !important;
  outline-offset: 2px;
  box-shadow:
    0 0 10px rgba(0,229,255,0.8),
    0 0 20px rgba(0,229,255,0.4),
    0 2px 0 var(--tile-edge-dark),
    0 3px 4px rgba(0,0,0,0.4) !important;
  animation: wait-tile-glow 1s infinite alternate;
}
.tile.large.reach-wait-tile::after {
  content: '待';
  position: absolute;
  bottom: 1px;
  right: 1px;
  font-size: 7px;
  color: #00e5ff;
  font-weight: 900;
  font-family: 'DotGothic16', monospace;
  line-height: 1;
  text-shadow: 0 0 4px rgba(0,229,255,0.8);
}
@keyframes wait-tile-glow {
  from { outline-color: #00e5ff; box-shadow: 0 0 8px rgba(0,229,255,0.6); }
  to   { outline-color: #80f4ff; box-shadow: 0 0 16px rgba(0,229,255,1), 0 0 30px rgba(0,229,255,0.4); }
}
.tile.pon-target {
  outline: 3px solid #ff9800 !important;
  outline-offset: 2px;
  box-shadow: 0 0 14px rgba(255,152,0,0.9), 0 0 28px rgba(255,152,0,0.5) !important;
  animation: pon-blink 0.5s infinite alternate;
  z-index: 2;
  position: relative;
}
.tile.pon-hand-target {
  outline: 3px solid #ff9800 !important;
  outline-offset: 2px;
  box-shadow: 0 0 12px rgba(255,152,0,0.8) !important;
  animation: pon-blink 0.5s infinite alternate;
}
@keyframes pon-blink {
  from { outline-color: #ff9800; box-shadow: 0 0 10px rgba(255,152,0,0.6); }
  to   { outline-color: #ffd700; box-shadow: 0 0 24px rgba(255,215,0,1); }
}
.tile.reach-tile {
  transform: rotate(-90deg);
  box-shadow:
    inset 0 1px 0 white,
    0 0 10px var(--cyan-pop),
    0 2px 0 var(--tile-edge-dark);
}
.tile.last-discard {
  outline: 2px solid var(--red);
  animation: last-discard-blink 0.6s ease-out 2;
}
@keyframes last-discard-blink {
  0%, 100% { outline-color: var(--red); }
  50% { outline-color: var(--gold); }
}

/* 抜き北エリア（横向き・ドラ表示） */
.kita-area {
  display: flex;
  gap: 6px;
  margin-top: 4px;
  padding: 8px 8px 4px;
  align-items: center;
  background: rgba(255,215,0,0.1);
  border: 1px solid rgba(255,215,0,0.3);
  border-radius: 4px;
  min-height: 32px;
  position: relative;
}
.kita-area:empty { display: none; }
.kita-area::before {
  content: '抜北ドラ';
  font-family: 'DotGothic16', monospace;
  font-size: 10px;
  color: var(--gold);
  margin-right: 4px;
  white-space: nowrap;
}
.kita-tile-wrapper {
  width: 30px;
  height: 22px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  position: relative;
}
.tile.kita-tile {
  width: 22px;
  height: 30px;
  font-size: 12px;
  transform: rotate(-90deg);
  transform-origin: center;
  border-radius: 3px;
  border-width: 1px;
}
.tile.kita-tile .tile-jihai {
  font-size: 18px;
}
.kita-count-badge {
  margin-left: auto;
  background: var(--gold);
  color: #000;
  font-family: 'Bungee', sans-serif;
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 3px;
}

/* 副露（鳴き）エリア */
.melds-area {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
  margin-top: 2px;
}
.meld {
  display: flex;
  gap: 1px;
}
.meld .tile {
  width: 18px;
  aspect-ratio: 22/30;
  font-size: 10px;
  border-radius: 2px;
  border-width: 1px;
}
.meld .tile.rotated {
  transform: rotate(-90deg) translateX(-3px);
  margin-right: 4px;
}

/* 自分エリア */
.my-area {
  background: rgba(0,0,0,0.5);
  border-top: 2px solid rgba(255,215,0,0.4);
  padding: 6px 4px 8px;
  display: flex;
  flex-direction: column;
  gap: 5px;
  border-radius: 4px;
}
.my-info {
  display: grid;
  grid-template-columns: 1fr auto auto;
  align-items: center;
  gap: 8px;
  padding: 0 4px;
}
.my-name {
  font-family: 'DotGothic16', monospace; font-size: 11px;
  color: white;
  display: flex; align-items: center;
  white-space: nowrap;
}
.my-name .wind {
  display: inline-block;
  width: 22px; height: 22px; line-height: 22px;
  text-align: center;
  background: linear-gradient(135deg, var(--red), var(--red-deep));
  color: white;
  border-radius: 50%;
  font-size: 13px;
  font-family: 'Yuji Mai', serif;
  margin-right: 4px;
  font-weight: bold;
  box-shadow: 0 0 6px var(--red);
}
.my-score {
  font-family: 'Bungee', sans-serif;
  font-size: 18px;
  color: var(--gold);
  text-shadow: 0 0 8px rgba(255,215,0,0.5);
}
.my-chips {
  font-family: 'DotGothic16', monospace; font-size: 11px;
  color: var(--cyan-pop);
  display: flex; align-items: center; gap: 3px;
}

.my-hand-row {
  display: flex;
  gap: 1px;
  justify-content: center;
  align-items: flex-end;
  padding: 0 2px;
}
.tsumo-tile {
  animation: tsumo-pop 0.3s ease-out;
}
@keyframes tsumo-pop {
  0% { transform: translateY(-12px) scale(0.8); opacity: 0; }
  100% { transform: translateY(0) scale(1); opacity: 1; }
}

.action-bar {
  display: flex; gap: 3px;
  justify-content: center;
  flex-wrap: wrap;
  padding: 0 2px;
  min-height: 32px;
}
.action-btn {
  font-family: 'Yuji Mai', serif;
  font-size: 12px;
  font-weight: bold;
  letter-spacing: 1px;
  padding: 7px 8px;
  border-radius: 4px;
  border: none;
  background: rgba(255,255,255,0.1);
  color: white;
  cursor: pointer;
  min-width: 50px;
  white-space: nowrap;
}
.action-btn.tsumo {
  background: linear-gradient(135deg, var(--gold), var(--gold-dim));
  color: #1a1a1a;
  box-shadow: 0 0 10px rgba(255,215,0,0.5);
  font-size: 14px;
}
.action-btn.ron {
  background: linear-gradient(135deg, var(--red), var(--red-deep));
  color: white;
  box-shadow: 0 0 10px rgba(255,45,85,0.5);
  font-size: 14px;
}
.action-btn.reach {
  background: linear-gradient(135deg, var(--cyan-pop), #00aacc);
  color: #001a1f;
  box-shadow: 0 0 10px rgba(0,229,255,0.4);
}
.action-btn.reach-furiten {
  background: linear-gradient(135deg, #ff8c00, #cc6600);
  color: #1a0e00;
  box-shadow: 0 0 10px rgba(255,140,0,0.5);
  font-size: 11px;
}
.action-btn.fever {
  background: linear-gradient(45deg, var(--red), var(--gold), var(--magenta), var(--cyan-pop));
  background-size: 300% 300%;
  color: white;
  font-family: 'Bungee', sans-serif;
  font-size: 13px;
  letter-spacing: 1px;
  padding: 10px 12px;
  border: 2px solid white;
  box-shadow: 0 0 18px var(--gold), 0 0 25px var(--red), inset 0 0 8px rgba(255,255,255,0.4);
  animation: fever-btn-shine 1.2s linear infinite, fever-btn-pulse 0.5s ease-in-out infinite;
  text-shadow: 1px 1px 0 #000, -1px -1px 0 #000;
  min-width: 140px;
  flex: 2;
  position: relative;
}
.action-btn.fever::before {
  content: '★';
  position: absolute; left: 4px; top: 50%;
  transform: translateY(-50%);
  color: white; font-size: 16px;
  animation: fever-star 0.4s ease-in-out infinite alternate;
}
.action-btn.fever::after {
  content: '★';
  position: absolute; right: 4px; top: 50%;
  transform: translateY(-50%);
  color: white; font-size: 16px;
  animation: fever-star 0.4s ease-in-out infinite alternate-reverse;
}
@keyframes fever-btn-shine {
  0% { background-position: 0% 50%; }
  100% { background-position: 300% 50%; }
}
@keyframes fever-btn-pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}
@keyframes fever-star {
  0% { transform: translateY(-50%) scale(1) rotate(0deg); opacity: 1; }
  100% { transform: translateY(-50%) scale(1.3) rotate(180deg); opacity: 0.8; }
}
.action-btn.kan, .action-btn.pon, .action-btn.kita {
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.2);
}
.action-btn.skip {
  background: transparent;
  border: 1px solid rgba(255,255,255,0.15);
  color: rgba(255,255,255,0.6);
  font-size: 11px;
}

/* メッセージ */
.message-toast {
  position: fixed;
  top: 60px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,0.9);
  color: white;
  padding: 10px 20px;
  border-radius: 6px;
  border: 1px solid var(--gold-dim);
  font-family: 'DotGothic16', monospace;
  font-size: 13px;
  z-index: 200;
  animation: toast-show 0.3s ease-out;
  white-space: nowrap;
}
@keyframes toast-show {
  0% { opacity: 0; transform: translate(-50%, -10px); }
  100% { opacity: 1; transform: translate(-50%, 0); }
}

/* FEVER中演出 */
.app.fever-mode { animation: fever-bg-shake 0.15s infinite; }
.app.fever-mode::before {
  content: ''; position: absolute; inset: 0;
  background: repeating-linear-gradient(45deg,
    transparent 0, transparent 30px,
    rgba(255,215,0,0.04) 30px, rgba(255,215,0,0.04) 60px,
    transparent 60px, transparent 90px,
    rgba(255,45,85,0.04) 90px, rgba(255,45,85,0.04) 120px);
  animation: fever-stripes 1s linear infinite;
  pointer-events: none; z-index: 1;
}
.app.fever-mode::after {
  content: ''; position: absolute; inset: 0;
  border: 3px solid;
  border-image: linear-gradient(45deg, var(--red), var(--gold), var(--cyan-pop), var(--magenta)) 1;
  animation: fever-border 0.5s infinite;
  pointer-events: none; z-index: 2;
}
@keyframes fever-stripes { 0% { background-position: 0 0; } 100% { background-position: 60px 60px; } }
@keyframes fever-border {
  0%, 100% { opacity: 1; filter: hue-rotate(0deg); }
  50% { opacity: 0.6; filter: hue-rotate(180deg); }
}
@keyframes fever-bg-shake {
  0%, 100% { transform: translate(0, 0); }
  25% { transform: translate(-1px, 1px); }
  50% { transform: translate(1px, -1px); }
  75% { transform: translate(-1px, -1px); }
}

/* FEVER演出オーバーレイ */
.fever-overlay {
  position: fixed; inset: 0;
  pointer-events: none; z-index: 1000;
  display: none;
  align-items: center; justify-content: center;
  overflow: hidden;
}
.fever-overlay.show { display: flex; }
.fever-overlay::before {
  content: ''; position: absolute; inset: 0;
  background: repeating-conic-gradient(from 0deg,
    var(--red) 0deg 12deg,
    var(--gold) 12deg 24deg,
    var(--cyan-pop) 24deg 36deg,
    var(--magenta) 36deg 48deg);
  animation: fever-spin 2s linear infinite, fever-strobe 0.1s linear infinite;
  opacity: 0.95;
}
@keyframes fever-spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
@keyframes fever-strobe { 0%, 100% { filter: brightness(1); } 50% { filter: brightness(1.5); } }
.fever-overlay .fever-text {
  font-family: 'Bungee', sans-serif;
  font-size: 70px;
  color: white;
  letter-spacing: 6px;
  position: relative; z-index: 10;
  text-shadow:
    0 0 4px white,
    -3px 3px 0 var(--red),
    3px -3px 0 var(--cyan-pop),
    0 0 60px white,
    0 0 100px var(--gold);
  animation: fever-text-bounce 0.3s infinite, fever-text-jiggle 0.05s infinite;
  -webkit-text-stroke: 2px black;
  transform: rotate(-8deg);
  text-align: center;
}
@keyframes fever-text-bounce { 0%, 100% { transform: rotate(-8deg) scale(1); } 50% { transform: rotate(-8deg) scale(1.15); } }
@keyframes fever-text-jiggle {
  0%, 100% { translate: 0 0; }
  25% { translate: -2px 1px; } 50% { translate: 2px -1px; } 75% { translate: -1px -2px; }
}
.fever-overlay .fever-sub {
  position: absolute; bottom: 25%; left: 50%;
  transform: translateX(-50%);
  font-family: 'Bungee', sans-serif;
  font-size: 18px;
  color: white;
  letter-spacing: 2px;
  -webkit-text-stroke: 1.5px black;
  text-shadow: 0 0 16px var(--gold);
  z-index: 10;
  white-space: nowrap;
  animation: fever-sub-pop 0.4s ease-out 0.3s both;
}
@keyframes fever-sub-pop {
  0% { transform: translateX(-50%) translateY(40px) scale(0); opacity: 0; }
  100% { transform: translateX(-50%) translateY(0) scale(1); opacity: 1; }
}
.fever-overlay .sparkle {
  position: absolute; width: 6px; height: 6px;
  background: white; border-radius: 50%;
  box-shadow: 0 0 10px white, 0 0 20px var(--gold);
  z-index: 5;
}
@keyframes sparkle-twinkle {
  0%, 100% { opacity: 0; transform: scale(0); }
  50% { opacity: 1; transform: scale(1.5); }
}

/* アガリ画面 */
.agari-screen {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.97);
  display: none;
  flex-direction: column;
  align-items: center; justify-content: flex-start;
  padding: 16px 12px;
  gap: 14px;
  overflow-y: auto;
  z-index: 500;
}
.agari-screen.show { display: flex; }
.agari-banner {
  font-family: 'Bungee', sans-serif;
  font-size: 72px;
  background: linear-gradient(45deg, var(--red), var(--gold), var(--red));
  background-size: 200% 200%;
  -webkit-background-clip: text; background-clip: text;
  color: transparent;
  letter-spacing: 8px;
  animation: agari-pop 0.5s ease-out, rainbow-shift 2s infinite;
  filter: drop-shadow(0 0 24px rgba(255,215,0,0.7));
}
@keyframes agari-pop {
  0% { transform: scale(0) rotate(-10deg); }
  60% { transform: scale(1.2) rotate(3deg); }
  100% { transform: scale(1) rotate(0deg); }
}

/* アガリ牌の強調 */
.agari-hand {
  display: flex; gap: 4px; flex-wrap: wrap;
  justify-content: center;
  align-items: flex-end;
  padding: 14px 10px;
  background: rgba(255,255,255,0.05);
  border: 1.5px solid rgba(255,215,0,0.4);
  border-radius: 8px;
  max-width: 100%;
  box-shadow: 0 0 20px rgba(255,215,0,0.15);
}
.agari-hand .tile {
  width: 38px; aspect-ratio: 22/30; font-size: 18px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.7);
  border-width: 1.5px;
}
/* 和了牌の区切り線 */
.agari-winning-sep {
  width: 2px;
  height: 52px;
  background: var(--gold);
  border-radius: 1px;
  margin: 0 4px;
  box-shadow: 0 0 8px rgba(255,215,0,0.9);
  align-self: center;
}
/* 和了牌の強調 */
.agari-hand .tile.winning-tile {
  border-color: #ffd700 !important;
  border-width: 2px !important;
  box-shadow:
    0 0 16px rgba(255,215,0,1),
    0 0 32px rgba(255,215,0,0.5),
    0 4px 8px rgba(0,0,0,0.6);
  background: linear-gradient(180deg, #fffde7, #fff9c4, #fff59d) !important;
  z-index: 5;
  position: relative;
  animation: winning-tile-entrance 1.5s cubic-bezier(0.16, 1.5, 0.5, 1) forwards;
}
/* 和了牌のスローモーション登場 */
@keyframes winning-tile-entrance {
  0%   { 
    opacity: 0;
    transform: translateY(-80px) scale(2.5) rotateY(180deg);
    filter: blur(8px) brightness(2);
  }
  30%  { 
    opacity: 1;
    transform: translateY(-30px) scale(1.8) rotateY(0deg);
    filter: blur(2px) brightness(1.5);
  }
  60%  {
    transform: translateY(-15px) scale(1.3);
    filter: blur(0) brightness(1.2);
  }
  85%  {
    transform: translateY(-10px) scale(1.15);
  }
  100% { 
    opacity: 1;
    transform: translateY(-8px) scale(1.12);
    filter: blur(0) brightness(1);
  }
}
/* 和了牌のキラキラパルス */
.agari-hand .tile.winning-tile::after {
  content: '';
  position: absolute;
  inset: -4px;
  border: 2px solid #ffd700;
  border-radius: 6px;
  opacity: 0;
  animation: winning-pulse 1.2s ease-in-out 1.5s infinite;
  pointer-events: none;
}
@keyframes winning-pulse {
  0%, 100% { opacity: 0; transform: scale(1); }
  50% { opacity: 1; transform: scale(1.15); }
}

.yaku-list {
  display: flex; flex-direction: column;
  gap: 4px;
  width: 100%; max-width: 380px;
}
.yaku-item {
  display: flex; justify-content: space-between;
  font-family: 'DotGothic16', monospace; font-size: 15px;
  padding: 6px 14px;
  background: rgba(255,255,255,0.04);
  border-radius: 3px;
}
.yaku-item .han { color: var(--gold); font-weight: bold; }
.agari-score { text-align: center; }
.agari-score .han-fu {
  font-family: 'DotGothic16', monospace; font-size: 16px;
  color: rgba(255,255,255,0.8);
}
/* 点数を大きく見やすく */
.agari-score .points {
  font-family: 'Bungee', sans-serif; font-size: 64px;
  color: var(--gold);
  letter-spacing: 2px;
  line-height: 1;
  text-shadow:
    0 0 30px rgba(255,215,0,0.9),
    0 0 60px rgba(255,215,0,0.4);
  animation: points-pop 0.6s cubic-bezier(0.16, 1.5, 0.5, 1);
}
@keyframes points-pop {
  0% { transform: scale(0.5); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}
.agari-next-btn {
  font-family: 'Yuji Mai', serif;
  font-size: 20px;
  letter-spacing: 4px;
  padding: 14px 48px;
  background: linear-gradient(135deg, var(--gold), var(--gold-dim));
  color: #000;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  margin-top: 8px;
  box-shadow: 0 4px 12px rgba(255,215,0,0.3);
}

/* チップ移動アニメーション用 */
.chip-flying {
  position: fixed;
  z-index: 600;
  pointer-events: none;
  transition: transform 1.2s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 1.2s ease-in-out;
  width: 36px;
  height: 14px;
  border-radius: 50%;
  border: 2px solid rgba(0,0,0,0.6);
  box-shadow:
    inset 0 2px 0 rgba(255,255,255,0.4),
    inset 0 -2px 0 rgba(0,0,0,0.4),
    0 4px 16px rgba(0,0,0,0.8),
    0 0 24px currentColor,
    0 0 48px currentColor;
}
.chip-flying.black {
  background: radial-gradient(ellipse at center, #6a6a6a 0%, #1a1a1a 70%, #000 100%);
  border-color: #ffd700;
  color: #ffd700;
}
.chip-flying.blue {
  background: radial-gradient(ellipse at center, #88bbff 0%, #1565c0 60%, #0d47a1 100%);
  color: #5599ff;
}
.chip-flying.green {
  background: radial-gradient(ellipse at center, #88dd88 0%, #1a5d2c 60%, #0d3818 100%);
  color: #66bb6a;
}
.chip-flying.orange {
  background: radial-gradient(ellipse at center, #ffcc66 0%, #e67300 60%, #b35400 100%);
  color: #ffa040;
}

/* チップ着弾時の爆発エフェクト */
.chip-impact {
  position: fixed;
  z-index: 601;
  pointer-events: none;
  width: 80px;
  height: 80px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255,215,0,0.9) 0%, rgba(255,215,0,0.4) 40%, transparent 70%);
  transform: translate(-50%, -50%) scale(0);
  animation: chip-impact 0.6s ease-out forwards;
}
@keyframes chip-impact {
  0%   { transform: translate(-50%, -50%) scale(0); opacity: 1; }
  60%  { transform: translate(-50%, -50%) scale(2); opacity: 0.8; }
  100% { transform: translate(-50%, -50%) scale(3); opacity: 0; }
}

/* 勝者の行が受け取り時に光る */
.winner-receive-flash {
  animation: winner-receive 0.4s ease-in-out 3;
}
@keyframes winner-receive {
  0%, 100% { box-shadow: 0 0 0 rgba(255,215,0,0); transform: scale(1); }
  50% { box-shadow: 0 0 30px rgba(255,215,0,1), 0 0 60px rgba(255,215,0,0.6); transform: scale(1.04); }
}

/* チップの軌跡（光の尾） */
.chip-trail {
  position: fixed;
  z-index: 599;
  pointer-events: none;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: radial-gradient(circle, currentColor, transparent);
  opacity: 0.8;
  animation: trail-fade 0.5s ease-out forwards;
}
@keyframes trail-fade {
  0% { opacity: 0.8; transform: scale(1); }
  100% { opacity: 0; transform: scale(0.3); }
}

/* ドラ牌の強調表示（表ドラ：金色） */
.agari-hand .tile.dora-highlight {
  position: relative;
  animation: dora-glow 1.5s ease-in-out infinite;
  z-index: 2;
}
.agari-hand .tile.dora-highlight::before {
  content: '';
  position: absolute;
  inset: -4px;
  border-radius: 6px;
  background: linear-gradient(45deg, #ffd700, #ff8800, #ffd700, #ffaa00);
  background-size: 300% 300%;
  z-index: -1;
  animation: dora-frame 2s linear infinite;
  filter: blur(3px);
}
@keyframes dora-glow {
  0%, 100% { box-shadow: 0 0 16px rgba(255,215,0,0.9), 0 0 32px rgba(255,140,0,0.6); }
  50% { box-shadow: 0 0 28px rgba(255,215,0,1), 0 0 56px rgba(255,140,0,0.9); }
}
@keyframes dora-frame {
  0% { background-position: 0% 0%; }
  100% { background-position: 300% 0%; }
}

/* 赤ドラ（赤色） */
.agari-hand .tile.aka-dora-highlight {
  position: relative;
  animation: aka-dora-glow 1.5s ease-in-out infinite;
  z-index: 2;
}
.agari-hand .tile.aka-dora-highlight::before {
  content: '';
  position: absolute;
  inset: -4px;
  border-radius: 6px;
  background: linear-gradient(45deg, #ff2d55, #ff0033, #ff2d55, #ff5577);
  background-size: 300% 300%;
  z-index: -1;
  animation: dora-frame 2s linear infinite;
  filter: blur(3px);
}
@keyframes aka-dora-glow {
  0%, 100% { box-shadow: 0 0 16px rgba(255,45,85,0.9), 0 0 32px rgba(255,0,0,0.6); }
  50% { box-shadow: 0 0 28px rgba(255,45,85,1), 0 0 56px rgba(255,0,0,0.9); }
}

/* 裏ドラ（紫色） */
.agari-hand .tile.ura-dora-highlight {
  position: relative;
  animation: ura-dora-glow 1.5s ease-in-out infinite;
  z-index: 2;
}
.agari-hand .tile.ura-dora-highlight::before {
  content: '';
  position: absolute;
  inset: -4px;
  border-radius: 6px;
  background: linear-gradient(45deg, #ab47bc, #7b1fa2, #ab47bc, #c479d0);
  background-size: 300% 300%;
  z-index: -1;
  animation: dora-frame 2s linear infinite;
  filter: blur(3px);
}
@keyframes ura-dora-glow {
  0%, 100% { box-shadow: 0 0 16px rgba(171,71,188,0.9), 0 0 32px rgba(123,31,162,0.6); }
  50% { box-shadow: 0 0 28px rgba(171,71,188,1), 0 0 56px rgba(123,31,162,0.9); }
}

/* 北ドラ（緑色） */
.agari-hand .tile.kita-dora-highlight {
  position: relative;
  animation: kita-dora-glow 1.5s ease-in-out infinite;
  z-index: 2;
}
.agari-hand .tile.kita-dora-highlight::before {
  content: '';
  position: absolute;
  inset: -4px;
  border-radius: 6px;
  background: linear-gradient(45deg, #4caf50, #2e7d32, #4caf50, #66bb6a);
  background-size: 300% 300%;
  z-index: -1;
  animation: dora-frame 2s linear infinite;
  filter: blur(3px);
}
@keyframes kita-dora-glow {
  0%, 100% { box-shadow: 0 0 16px rgba(76,175,80,0.9), 0 0 32px rgba(46,125,50,0.6); }
  50% { box-shadow: 0 0 28px rgba(76,175,80,1), 0 0 56px rgba(46,125,50,0.9); }
}

/* ドララベル（種類別の色） */
.dora-label-tag {
  position: absolute;
  top: -14px;
  right: -8px;
  background: linear-gradient(135deg, #ffd700, #ff8800);
  color: #000;
  font-family: 'Bungee', sans-serif;
  font-size: 12px;
  padding: 3px 7px;
  border-radius: 4px;
  font-weight: bold;
  text-shadow: 0 1px 0 rgba(255,255,255,0.6);
  border: 1.5px solid rgba(255,255,255,0.8);
  z-index: 10;
  box-shadow: 0 0 12px #ffd700, 0 2px 4px rgba(0,0,0,0.6);
  animation: dora-tag-bounce 1.2s ease-in-out infinite;
  letter-spacing: 1px;
}
@keyframes dora-tag-bounce {
  0%, 100% { transform: scale(1) rotate(-3deg); }
  50% { transform: scale(1.15) rotate(3deg); }
}
.dora-label-tag.aka {
  background: linear-gradient(135deg, #ff2d55, #c5002a);
  color: #fff;
  text-shadow: 0 1px 0 rgba(0,0,0,0.5);
  box-shadow: 0 0 14px #ff2d55, 0 2px 4px rgba(0,0,0,0.6);
}
.dora-label-tag.ura {
  background: linear-gradient(135deg, #ab47bc, #7b1fa2);
  color: #fff;
  text-shadow: 0 1px 0 rgba(0,0,0,0.5);
  box-shadow: 0 0 14px #ab47bc, 0 2px 4px rgba(0,0,0,0.6);
}
.dora-label-tag.kita {
  background: linear-gradient(135deg, #4caf50, #2e7d32);
  color: #fff;
  text-shadow: 0 1px 0 rgba(0,0,0,0.5);
  box-shadow: 0 0 14px #4caf50, 0 2px 4px rgba(0,0,0,0.6);
}

/* ドラ牌が降ってくる演出（手牌内のドラがキラキラ光る） */
.agari-hand .tile.dora-highlight,
.agari-hand .tile.aka-dora-highlight,
.agari-hand .tile.ura-dora-highlight,
.agari-hand .tile.kita-dora-highlight {
  animation-delay: 0.5s;
}
.agari-hand .tile.dora-highlight::after,
.agari-hand .tile.aka-dora-highlight::after,
.agari-hand .tile.ura-dora-highlight::after,
.agari-hand .tile.kita-dora-highlight::after {
  content: '';
  position: absolute;
  inset: -2px;
  border-radius: 6px;
  background: radial-gradient(ellipse at center, rgba(255,215,0,0.3), transparent 70%);
  pointer-events: none;
  z-index: -1;
  animation: dora-shimmer 1.8s ease-in-out infinite;
}
@keyframes dora-shimmer {
  0%, 100% { opacity: 0.4; }
  50% { opacity: 1; }
}

/* トビ演出 */
#tobi-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.95);
  z-index: 600;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 20px;
}
#tobi-overlay.show { display: flex; }
.tobi-title {
  font-family: 'Bungee', sans-serif;
  font-size: 72px;
  color: #ff2d55;
  letter-spacing: 4px;
  text-shadow: 0 0 40px rgba(255,45,85,0.8);
  animation: agari-pop 0.5s ease-out;
}
.tobi-name {
  font-family: 'DotGothic16', monospace;
  font-size: 20px;
  color: white;
  text-align: center;
}
.tobi-btn {
  font-family: 'DotGothic16', monospace;
  font-size: 16px;
  padding: 12px 32px;
  background: #ff2d55;
  color: white;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  margin-top: 10px;
}

/* スタート画面 */
/* ============================
   スタート画面（花火付き）
   ============================ */
.start-screen {
  position: fixed;
  inset: 0;
  background: radial-gradient(ellipse at 50% 60%, #1a0030 0%, #050008 60%, #000 100%);
  z-index: 300;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 24px;
  padding: 20px;
  overflow: hidden;
}
.start-screen.hide { display: none; }

/* 花火キャンバス（最背面） */
#fireworks-canvas {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 0;
}

/* タイトル */
.start-logo {
  position: relative;
  z-index: 10;
  text-align: center;
}
.start-logo .title {
  font-family: 'Bungee', sans-serif;
  font-size: 72px;
  background: linear-gradient(45deg, #ff2d55, #ffd700, #ff2d55, #ffd700);
  background-size: 300% 300%;
  -webkit-background-clip: text; background-clip: text;
  color: transparent;
  letter-spacing: 8px;
  animation: rainbow-shift 2s infinite;
  filter: drop-shadow(0 0 20px rgba(255,215,0,0.8));
  text-align: center;
  line-height: 1;
}
.start-logo .subtitle {
  font-family: 'Yuji Boku', 'Yuji Mai', serif;
  font-size: 18px;
  color: var(--gold);
  letter-spacing: 12px;
  text-align: center;
  margin-top: 10px;
  text-shadow: 0 0 10px rgba(255,215,0,0.6);
  animation: pulse-glow 2s infinite alternate;
}
.start-logo .tagline {
  font-family: 'DotGothic16', monospace;
  font-size: 10px;
  color: rgba(255,255,255,0.5);
  letter-spacing: 2px;
  text-align: center;
  margin-top: 14px;
}
@keyframes rainbow-shift {
  0% { background-position: 0% 50%; }
  100% { background-position: 200% 50%; }
}
@keyframes pulse-glow {
  from { text-shadow: 0 0 8px rgba(255,215,0,0.4); opacity: 0.8; }
  to   { text-shadow: 0 0 24px rgba(255,215,0,1); opacity: 1; }
}

/* 牌のシルエット装飾 */
.start-tiles-deco {
  position: relative;
  z-index: 10;
  display: flex; gap: 6px;
  opacity: 0.4;
  filter: brightness(0.6) sepia(1) hue-rotate(30deg);
  margin-bottom: -10px;
}
.start-tile-deco {
  width: 28px; height: 40px;
  background: linear-gradient(180deg, #fff8e1, #ffe0a0);
  border-radius: 3px;
  border: 1px solid #c9a96e;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Yuji Boku', serif;
  font-size: 16px;
  color: #c62828;
  box-shadow: 0 2px 6px rgba(0,0,0,0.6);
  animation: tile-float 3s infinite ease-in-out;
}
.start-tile-deco:nth-child(2) { animation-delay: 0.4s; color: #1a3a78; }
.start-tile-deco:nth-child(3) { animation-delay: 0.8s; color: #c62828; }
.start-tile-deco:nth-child(4) { animation-delay: 1.2s; color: #1a3a78; }
.start-tile-deco:nth-child(5) { animation-delay: 1.6s; color: #ffd700; }
@keyframes tile-float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
}

.start-btn {
  position: relative;
  z-index: 10;
  font-family: 'Bungee', sans-serif;
  font-size: 20px;
  letter-spacing: 4px;
  padding: 18px 48px;
  background: linear-gradient(135deg, #ff2d55, #c5002a, #ff2d55);
  background-size: 200% 200%;
  color: white;
  border: 2px solid #ffd700;
  border-radius: 6px;
  box-shadow:
    0 0 30px rgba(255,45,85,0.6),
    0 0 60px rgba(255,45,85,0.3),
    inset 0 1px 0 rgba(255,255,255,0.2);
  cursor: pointer;
  animation: btn-pulse 1.5s infinite alternate;
  position: relative;
  z-index: 1;
}
@keyframes btn-pulse {
  from { box-shadow: 0 0 20px rgba(255,45,85,0.4), 0 0 40px rgba(255,215,0,0.2); transform: scale(1); }
  to   { box-shadow: 0 0 40px rgba(255,45,85,0.8), 0 0 80px rgba(255,215,0,0.5); transform: scale(1.04); }
}
.start-info {
  font-family: 'DotGothic16', monospace;
  font-size: 11px;
  color: rgba(255,255,255,0.6);
  text-align: center;
  max-width: 280px;
  line-height: 1.8;
  position: relative; z-index: 10;
}

/* ============================
   アクション演出（リーチ/ツモ/ロン/ポン等）
   ============================ */
#action-splash {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: none;
  z-index: 200;
}
.action-splash-text {
  font-family: 'Bungee', sans-serif;
  font-size: 80px;
  font-weight: 900;
  letter-spacing: 4px;
  text-align: center;
  opacity: 0;
  transform: scale(0.3) rotate(-8deg);
  filter: drop-shadow(0 0 30px currentColor);
  animation: action-pop 0.8s cubic-bezier(0.16, 1.8, 0.5, 1) forwards;
}
.action-splash-text.ron    { color: #ff2d55; text-shadow: 0 0 40px #ff2d55, 0 0 80px rgba(255,45,85,0.5); }
.action-splash-text.tsumo { color: #00e5ff; text-shadow: 0 0 40px #00e5ff, 0 0 80px rgba(0,229,255,0.5); }
.action-splash-text.reach  { color: #ffd700; text-shadow: 0 0 40px #ffd700, 0 0 80px rgba(255,215,0,0.5); }
.action-splash-text.pon    { color: #ff9800; text-shadow: 0 0 40px #ff9800, 0 0 80px rgba(255,152,0,0.5); }
.action-splash-text.kan    { color: #ab47bc; text-shadow: 0 0 40px #ab47bc, 0 0 80px rgba(171,71,188,0.5); }
.action-splash-text.kita   { color: #1a5d2c; filter: drop-shadow(0 0 20px #4caf50); }

/* ============================
   カットイン演出
   ============================ */
#cutin-overlay {
  position: fixed; inset: 0;
  pointer-events: none;
  z-index: 250;
  overflow: hidden;
}
.cutin-bg-band {
  position: absolute;
  top: -20%; left: -30%;
  width: 160%; height: 140%;
  transform: rotate(-12deg) translateX(-150%);
  background: linear-gradient(90deg,
    transparent 0%,
    rgba(0,0,0,0.85) 15%,
    rgba(0,0,0,0.85) 85%,
    transparent 100%);
  animation: cutin-band-slide 1.4s cubic-bezier(0.2, 0.8, 0.3, 1) forwards;
}
.cutin-bg-band.ron {
  background: linear-gradient(90deg,
    transparent 0%,
    rgba(120,0,30,0.92) 10%,
    rgba(200,0,40,0.92) 30%,
    rgba(255,30,60,0.95) 50%,
    rgba(200,0,40,0.92) 70%,
    rgba(120,0,30,0.92) 90%,
    transparent 100%);
}
.cutin-bg-band.tsumo {
  background: linear-gradient(90deg,
    transparent 0%,
    rgba(0,60,120,0.92) 10%,
    rgba(0,150,200,0.92) 30%,
    rgba(0,229,255,0.95) 50%,
    rgba(0,150,200,0.92) 70%,
    rgba(0,60,120,0.92) 90%,
    transparent 100%);
}
.cutin-bg-band.reach {
  background: linear-gradient(90deg,
    transparent 0%,
    rgba(120,90,0,0.92) 10%,
    rgba(200,160,0,0.92) 30%,
    rgba(255,215,0,0.95) 50%,
    rgba(200,160,0,0.92) 70%,
    rgba(120,90,0,0.92) 90%,
    transparent 100%);
}
@keyframes cutin-band-slide {
  0%   { transform: rotate(-12deg) translateX(-150%); }
  35%  { transform: rotate(-12deg) translateX(0); }
  65%  { transform: rotate(-12deg) translateX(0); }
  100% { transform: rotate(-12deg) translateX(150%); }
}

/* カットイン上下の白帯（斜めライン） */
.cutin-line {
  position: absolute;
  left: -30%;
  width: 160%;
  height: 6px;
  background: linear-gradient(90deg, transparent, #fff 30%, #fff 70%, transparent);
  transform: rotate(-12deg) translateX(-150%);
  box-shadow: 0 0 15px #fff, 0 0 30px rgba(255,255,255,0.5);
}
.cutin-line.top { top: 30%; animation: cutin-band-slide 1.4s cubic-bezier(0.2, 0.8, 0.3, 1) 0.05s forwards; }
.cutin-line.bottom { top: 70%; animation: cutin-band-slide 1.4s cubic-bezier(0.2, 0.8, 0.3, 1) 0.1s forwards; }

/* カットインの大きなテキスト */
.cutin-text-wrap {
  position: absolute;
  top: 50%;
  left: 55%;
